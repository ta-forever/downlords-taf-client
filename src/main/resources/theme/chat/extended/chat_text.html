<div id="chat-text-{message-id}" class="text {css-classes}" style="{inline-style}">
  <span class="text-content" style="display: {text-content-display};">
    {text}
    <span class="toxicity" style="display: {toxicity-display};">[{toxicity}]</span>
  </span>
  <span class="text-redacted" style="display: {text-redacted-display};" onclick="toggleTextVisibility('{message-id}')">
    {text_redacted}
  </span>
</div>
