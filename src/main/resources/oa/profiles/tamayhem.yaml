# taf-client-managed oa-profile v1 -- generated by .claude/skills/oa-mod-profiles/gen_oa_profiles.py from tadr-ddraw config_mayhem.h; do not edit
# Open Annihilation profile for the TAF featured mod 'tamayhem'. See OA_PROFILES.md for what each line is for.
oamod: 1
id: taf-mayhem
name: 'TAF Mayhem'
version: 11.3.0
description: 'Mayhem 11.3.0 under TAF.'
requires: {base: ta-3.1c, catalogue: 1}
author: {name: TA Forever}
packaging: {revision: 1, date: 2026-10-10, packager: TA Forever}

identity:
  display-version: 11.3.0
  network-version: [11, 3]        # what this mod's TotalA.exe announces
  replay-network-version: [11, 3]
  settings-file: mayhem.ini
  registry-root: 'Software\TotalM'

layout:
  revision-archive: mayhem.gp3       # TotalA.exe is patched to mount this instead of rev31.gp3
  directories: {guis: guiM, weapons: weaponM, unitpics: unitpicM, download: downloadsM}

limits:
  units-per-player: {default: 1500, max: 1500}      # tdraw EngineLimits / ini UnitLimit
  unit-types: true                   # ini UnitType = 16000 -> 16384-bit sets
  effects: true                      # ini SfxLimit = 20480
  path-search-budget: true           # ini AISearchMapEntries = 66650
  model-composite: true              # ini X/Y_CompositeBuf = 1280

script-extensions:
  fidelity: exact
  get: [unit.kills-x100, unit.min-id, unit.max-id, unit.my-id, unit.owner-of, unit.build-percent-left-of, unit.allied-with, unit.is-local]   # tplayx COB_extensions, usual indices 32 and 69..75

data-keys:
  unit:
    VeterancyThresholds: veterancy.thresholds
    VeterancyAccuracyBuffRate: veterancy.accuracy-rate
    Rotations: units.build-facings
    PreviewPieces: ui.preview-pieces
    PreviewPiecesS: ui.preview-pieces-by-facing
    PreviewFaceOpponent: ui.preview-face-opponent
    PreviewObject3D: ui.preview-object
  weapon:
    nottoair: weapons.not-to-air
    surfacefire: weapons.surface-fire
    nottounderwater: weapons.not-to-underwater
    nomapweaponalert: weapons.no-map-alert

hacks:
  recorder.ta-demo-recorder: {auto-extension: .tmd, manual-extension: .tmd, compress-files: true, cheat-notices: false, registry-root: 'Software\TotalM\TA Demo'}   # tplayx: every TAF game is recorded; per-mod demo extension, compression, cheat notices
  recorder.ten-player-replay: true   # tdraw TenPlayerReplay
  network.chat-extension-channel: true   # tdraw PacketChatRouter (CHAT_05 hijack sub-ids)
  network.vercheck: true   # tdraw ChallengeResponse (.report / VerCheck)
  network.vote-reject: true   # tdraw VoteReject / VoteDialog
  network.lag-guard: {gap-ms: 500}   # LAG_SWITCH_GUARD_ENABLE (LagSwitchGuard FREEZE_THRESHOLD_MS 500)
  network.recorder-session-commands: true   # tplayx: .autopause .voteready .forcego .fakewatch .randmap ...
  console.game-speed-range: true   # tplayx SpeedHack: .syncon/.syncoff
  sharing.recorder-take-give: true   # tplayx .take/.give; TAKE_CLAIM_ENABLE arbitrates claims on top
  setup.commander-warp: true   # tplayx .cmdwarp
  setup.recorder-prebuilt-base: true   # tplayx .base/.dobase/.baseoff
  setup.map-scripted-units: true   # tdraw MultiplayerSchemaUnits
  setup.team-start-positions: true   # tdraw StartPositions + AutoTeam
  teams.team-number-alliances: true   # tdraw AutoTeam (+autoteam / +randomteam)
  orders.build-site-kickout: true   # CONSTRUCTION_KICKOUT_ENABLE
  orders.con-patrol-guard-options: true   # FIXED_POSN_GUARDING_CONS_ENABLE / PATROLING_CONS_RECLAIM_OR_ASSIST_ENABLE
  economy.deterministic-wind: true   # WIND_SPEED_SYNC
  economy.stats-exclude-shared-income: true   # tdraw RemoveSharedResourcesFromTotal
  veterancy.model: true   # tdraw VeterancyHack (thresholds 5 10 15 20 25, damage-taken cap 25, unbounded dealt/capture)
  units.build-rotation: true   # tdraw CUnitRotate (Rotations= in the FBI)
  units.init-cloaked-after-build: true   # exe patch 004017F8
  orders.repairing-state-target-activity: true   # exe patch 00402608 (repair pad that is OFF)
  orders.selective-weapon-occupy: {attack: ordered-slot-both-stages, suppress: slot-2}   # exe patches 004035EE + 004037E0 / 00403975
  orders.weapons-free-while-busy: [nanolathe, help-build, reclaim-unit, repair]   # exe patches 00403D24 / 004040B4 / 004043A1 / 004047C6 / 00405546
  weapons.retarget-out-of-range: true   # exe patch 00408A26 (targetlocking removed)
  orders.reclaim-command-any-unit: true   # exe patch 0043E782
  orders.resurrector-reclaims-features: true   # exe patch: resurrectors reclaim features on command
  air.guard-respects-hold-position: true   # exe patch 00405D57 (applies to ground guards in TA; OA: aircraft only)
  units.water-state-rules: {rules: reordered, start-submerged: true}   # exe patches 0043DB93 / 00485C69
  repair.healtime-self-heal: true   # exe patch 0048AF3D
  ai.commander-keeps-orders-when-damaged: true   # exe patch 00406FB4
  ai.nearest-enemy-filter: skip-submerged   # exe patch 00407223
  ai.builder-withhold-threshold: 12   # exe patch 0040816E (value 12)
  ai.factory-tick-filter: true   # exe patches 004086FF + 00408724
  console.key-remaps: true   # exe patches 00496694 + Insert + F10
  console.atm-amount: true   # exe patch: +atm fills storage
  ui.click-snap: {mex-default: 3, mex-max: 3, wreck-default: 1, wreck-max: 1}   # DEFAULT/MAX_MEX_SNAP_RADIUS, DEFAULT/MAX_WRECK_SNAP_RADIUS
  ui.megamap: {enhanced-minimap: true, dither: false, feature-blobs: true, ring-minimums: [0, 0, 0, 0, 0]}   # USEMEGAMAP / MEGAMAP_FEATURES; ring minimums are the stock ini's 0
  ui.whiteboard: true   # USEWHITEBOARD
  ui.resource-panel: true   # WEATHER_REPORT (clock / wind / tidal overlay)
  ui.map-features-ignore-los: true   # VISIBLE_MAP_DTS (player-11 features drawn regardless of LOS)
  ui.camera-sharing: true   # tplayx/tdraw .sharemappos / .lockon
  ui.allied-unit-display: true   # tplayx LOS_MiniMapUnits + LOS_GUIText
  ui.selection-shortcuts: true   # tdraw DoubleClick / ExternQuickKey; same-type selection past type 512
  ui.share-dialog-and-lobby-buttons: true   # tdraw ShareDialogExpand + battle-room buttons
  ui.text-rendering: {chat-backdrop: true}   # tdraw ChatBackdrop
  ui.display-modes: true   # tdraw DisplayModeMinHeight768 / MenuResolution
  ui.options-dialog: true   # tdraw ctrl+F2 dialog (dialog.cpp)
  ui.build-tools: true   # tdraw autoclick / OptimizeDT (dialog.cpp, changequeue.cpp)
  ui.build-preview: true   # tdraw BuildGhost (NanoframePreview)
  ui.veterancy-label: true   # tdraw VeterancyHack ('Vet<N>' label)
  ui.interface-fixes: [range-ring-3, radius-0, nanoframe-raster, bar-clamp, pad-cursor, cursor-reset, build-toggle, downloadmenu-zero, resurrect-spelling]   # tdraw ZeroingDownloadMenuAlloc etc.; 'Ressurection' spelling patch where the loader script carries it
  ui.unit-voice-fixes: true   # exe patches 00404C5F / 00414ABC / 00414D12
  ui.endgame-stats: true   # exe patch 0041DD4A
  ui.external-exports: true   # tdraw tafstatusexporter (TAFGameState)

settings:
  registry-seeds:
    SkirmishMap: Canal Crossing      # a fresh settings root has no map; OA then takes 'the first eligible skirmish map' and
                                     # cannot start hosting on Mayhem ('first eligible skirmish map cannot be selected')
