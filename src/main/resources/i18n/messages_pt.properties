# Description: adjust the latency threshold for relay server selection
settings.fa.iceAcceptableLatency.description =  Ajuste o limite para seleção de servidores de relay com base nos tempos de ping. Valores mais altos podem ser benéficos para jogadores localizados longe dos servidores de relay, garantindo uma seleção mais ampla para melhores conexões. Defina -1 para usar todos os relays.

