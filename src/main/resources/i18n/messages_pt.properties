# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = O TAF pode medir a perda de pacotes ao configurar o jogo. Se a perda de pacotes for muito alta, o TAF pode começar a enviar várias cópias de cada pacote para melhorar as chances de entrega. Essa opção pode ajudá-lo a iniciar um jogo, ou pode apenas entupir ainda mais sua rede. Se você tiver problemas para se conectar a jogos, tente habilitar essa opção e veja se ajuda.

