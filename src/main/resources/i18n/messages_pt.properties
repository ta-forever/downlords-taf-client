settings.fa.featuredModRevertOption.description = Antes de você entrar em um jogo ou assistir a um replay, o TAF vai verificar a versão correta do mod para você. Se o TAF encontrar modificações em sua instalação (talvez porque você está desenvolvendo um novo mod), o TAF não poderá prosseguir a menos que você permita que o TAF reverta essas alterações. O TAF deve ter permissão para reverter seu mod de volta para uma versão oficial?

# Setting: force relay connection for game
