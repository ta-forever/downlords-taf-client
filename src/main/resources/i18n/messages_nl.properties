# Description: stagger player launches into the battleroom
settings.fa.enableSequencedLaunch.description = Laat spelers één voor één de strijdzaal betreden. Voorkomt dat de host wordt overspoeld met verbindingsverzoeken, wat kan resulteren in een groter succespercentage.

# Setting: specify custom command line invocation for Total Annihilation
