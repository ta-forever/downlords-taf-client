# Setting: directory containing the Total Annihilation executable
settings.fa.executionDirectory = Uitvoeringsmap
# Description: specify the directory for Total Annihilation executable
settings.fa.executionDirectory.description = In welke map het speluitvoerbare bestand moet worden uitgevoerd. Laat het leeg, tenzij u weet wat u doet.

# Setting: allow TAF to overwrite local changes to a mod
settings.fa.featuredModRevertOption = Lokale wijzigingen aan Mod overschrijven?
# Description: revert local mod changes to official version
settings.fa.featuredModRevertOption.description = Voordat je een spel betreedt of een herhaling bekijkt, controleert TAF of je de juiste versie van de mod hebt. Als TAF ontdekt dat je installatie gewijzigd is (misschien omdat je een nieuwe mod aan het ontwikkelen bent), kan TAF niet doorgaan tenzij je TAF toestaat deze wijzigingen te herstellen. Mag TAF je mod terugzetten naar een officiële versie?

# Setting: force relay connection for game
settings.fa.forceRelay = Doorstuur-verbinding forceren
# Description: use relay server for connection instead of direct peer-to-peer
settings.fa.forceRelay.description = Gebruik altijd een relay server in plaats van direct verbinden met peers. Dit leidt tot langzamere connecties, maar kan connectieproblemen oplossen.

# Setting: adjust latency threshold for relay selection
settings.fa.iceAcceptableLatency = Maximale aanvaardbare latentie van relais
# Description: adjust the latency threshold for relay server selection
settings.fa.iceAcceptableLatency.description =  Pas de drempel aan voor het selecteren van relayservers op basis van ping-tijden. Hogere waarden kunnen gunstig zijn voor spelers die zich ver van relay-servers bevinden, waardoor een bredere selectie voor betere verbindingen wordt gegarandeerd. Stel in op -1 om alle relais te gebruiken.

# Setting: maximum UDP packet size allowed
settings.fa.maxPacketSize = Maximale pakketgrootte
# Description: control the maximum size of UDP packets sent via ICE
settings.fa.maxPacketSize.description = Grote pakketten hebben soms problemen om over het internet te reizen. Kies Tiny als je wilt dat TAF een lagere limiet op de pakketgrootte plaatst. Dit kan de kansen verbeteren dat je pakketten hun bestemming bereiken.

# Setting: resend multiple copies of each UDP packet if packet loss is detected
settings.fa.proactiveResend = Proactief Opnieuw Verzenden
# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = TAF kan pakketverlies meten bij het instellen van het spel. Als het pakketverlies te hoog is, kan TAF beginnen met het verzenden van meerdere kopieën van elk pakket om de kans op aflevering te vergroten. Deze optie kan je helpen een spel te starten, of het kan je netwerk juist verder verstoppen. Als je problemen hebt met het verbinden met games, probeer dan deze optie in te schakelen en kijk of het helpt.

# Setting: run Total Annihilation as administrator
