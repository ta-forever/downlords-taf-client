achievement.gw.rank.arm1.title = Arm Soldaat
achievement.gw.rank.arm1.description = Meld je aan bij de rangen van de Arm. Elke oorlog begint met één enkele soldaat.
achievement.gw.rank.arm2.title = Arm Korporaal
achievement.gw.rank.arm2.description = Bewijs je vastberadenheid in de strijd en krijg je eerste commando over mede-strijders.
achievement.gw.rank.arm3.title = Arm Sergeant
achievement.gw.rank.arm3.description = Gesmeed in het vuur, leid je vanaf de frontlinie en inspireer je moed in de rangen.
achievement.gw.rank.arm4.title = Arm Luitenant
achievement.gw.rank.arm4.description = Vertrouwd met strategie en levens, draag je de vlag van de Arm naar betwiste werelden.
achievement.gw.rank.arm5.title = Arm Kapitein
achievement.gw.rank.arm5.description = Ervaren leider van compagnieën; jouw beslissingen bepalen de loop van planetaire oorlog.
achievement.gw.rank.arm6.title = Arm Majoor
achievement.gw.rank.arm6.description = Veteraan-commandant wiens overwinningen weerklinken door de sterren.
achievement.gw.rank.arm7.title = Arm Kolonel
achievement.gw.rank.arm7.description = Meester van campagnes; je orkestreert de bevrijding van hele systemen.
achievement.gw.rank.arm8.title = Arm Generaal
achievement.gw.rank.arm8.description = Oorlogsarchitect; jouw strategieën bepalen de opmars van de Arm door de melkweg.
achievement.gw.rank.arm9.title = Arm Commandant
achievement.gw.rank.arm9.description = Opperste gezag op het slagveld. De hoop van de Arm — en het lot van werelden — rust in jouw handen.

achievement.gw.rank.core1.title = Core Soldaat
achievement.gw.rank.core1.description = Geïntegreerd in de oorlogsmachine van de Core. Individualiteit is irrelevant; functie is alles.
achievement.gw.rank.core2.title = Core Korporaal
achievement.gw.rank.core2.description = Je efficiëntie neemt toe. Je leidt lagere eenheden in precieze, berekende aanvallen.
achievement.gw.rank.core3.title = Core Sergeant
achievement.gw.rank.core3.description = Gevechtsdata verfijnd. Je voert operaties uit met meedogenloze optimalisatie.
achievement.gw.rank.core4.title = Core Luitenant
achievement.gw.rank.core4.description = Tactische bevoegdheid verleend. Je coördineert aanvallen met machine-perfectie.
achievement.gw.rank.core5.title = Core Kapitein
achievement.gw.rank.core5.description = Commandoprotocol uitgebreid. Hele gevechtseenheden reageren op jouw berekende wil.
achievement.gw.rank.core6.title = Core Majoor
achievement.gw.rank.core6.description = Strategische subroutines ontgrendeld. Planetaire offensieven ontvouwen zich volgens jouw ontwerp.
achievement.gw.rank.core7.title = Core Kolonel
achievement.gw.rank.core7.description = Systeemniveau command bereikt. Weerstand wordt geanalyseerd, tegengegaan en geëlimineerd.
achievement.gw.rank.core8.title = Core Generaal
achievement.gw.rank.core8.description = Jij bent het knooppunt van oorlogslogica. Hele sectoren vallen voor jouw onvermijdelijke opmars.
achievement.gw.rank.core9.title = Core Commandant
achievement.gw.rank.core9.description = Top van de Core-hiërarchie. Jouw richtlijn is absoluut — assimilatie of vernietiging.

