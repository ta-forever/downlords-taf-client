# Description: enable immediate launch to battleroom when hosting a new game
settings.fa.enableAutoLaunchOnHost.description = Inschakelen als u Total Annihilation meteen naar de Battle Room wilt starten wanneer u een nieuw spel host. Als uitgeschakeld, zult u expliciet op de "Start" knop moeten klikken na het hosten van een spel.

# Setting: auto-launch to battleroom when joining a game
settings.fa.enableAutoLaunchOnJoin = Als deelnemer, automatisch naar Battle Room starten
# Description: launch directly into battleroom after joining a game
settings.fa.enableAutoLaunchOnJoin.description = Inschakelen als u Total Annihilation naar de Battle Room wilt starten zodra de host hetzelfde doet. Als uitgeschakeld, dient u expliciet op de "Start" knop te klikken na het deelnemen aan een spel.

# Setting: automatically create new game after the host leaves
settings.fa.enableAutoRehost = Automatisch herhosten
# Description: open a new game when the host leaves the current game
settings.fa.enableAutoRehost.description = Automatisch een nieuw spel openen telkens wanneer een spel dat u eerder heeft gehost eindigt

