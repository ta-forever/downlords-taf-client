# Description: forward in-game chat to TAF chat and vice versa
settings.fa.enableIrcIntegration.description = Wanneer ingeschakeld, wordt de in-game chat doorgestuurd naar de TAF-clientchat en vice versa. U kunt ook de chatverbinding in-game sluiten door "/closeirc" te typen

# Setting: stagger player launches to reduce server load
