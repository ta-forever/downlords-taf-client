settings.fa.forceRelay.description = Всегда использовать реле-сервер вместо пиров напрямую для подключения. Приводит к более медленному соединению, но может решить проблемы с подключением.

# Setting: adjust latency threshold for relay selection
settings.fa.iceAcceptableLatency = Макс. допустимая задержка реле
# Description: adjust the latency threshold for relay server selection
settings.fa.iceAcceptableLatency.description =  Настройте порог выбора серверов ретрансляции на основе времени пинга. Более высокие значения могут быть полезны для игроков, находящихся далеко от серверов ретрансляции, обеспечивая более широкий выбор для лучшего соединения. Установите значение -1, чтобы использовать все реле.

# Setting: maximum UDP packet size allowed
