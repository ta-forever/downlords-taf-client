# Description: control the maximum size of UDP packets sent via ICE
settings.fa.maxPacketSize.description = Большие пакеты иногда испытывают проблемы с прохождением через интернет. Выберите Tiny, если хотите, чтобы TAF устанавливал нижний предел размера пакета. Это может помочь повысить шансы на то, что ваши пакеты дойдут до пункта назначения.

# Setting: resend multiple copies of each UDP packet if packet loss is detected
settings.fa.proactiveResend = Проактивная повторная отправка
# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = TAF может измерять потерю пакетов при настройке игры. Если потеря пакетов слишком велика, TAF может начать посылать несколько копий каждого пакета для улучшения шансов на доставку. Эта опция может помочь вам запустить игру или просто забить вашу сеть еще больше. Если у вас есть проблемы с подключением к играм, попробуйте включить эту опцию и посмотрите, поможет ли это.

