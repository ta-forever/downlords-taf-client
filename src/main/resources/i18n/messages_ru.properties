# Onboarding (one-time, dismissible)
lp.intro.title = Очки ладдера
lp.intro.body = Очки ладдера (LP) — это ваш счёт на сезон. Вы получаете их в каждой игре за то, что делаете на поле боя, — уничтоженную технику, победы и разгром более сильных команд. Играйте весь сезон, чтобы подниматься по дивизионам. Плохая игра просто приносит меньше — вы никогда не теряете LP за поражение.
# Combat Score -> LP explainer (§13.7)
lp.combatScore.explainer = Боевой счёт = стоимость (металл + энергия / 60) уничтоженных вами вражеских юнитов. Ваши боевые LP — это ваша доля от лучшего боевого счёта игры: возглавьте таблицу и получите полную сумму, при победе или поражении.
lp.faq.fewerThanLastGame = Боевые LP — это ваша доля от лучшего боевого счёта игры, поэтому один и тот же счёт может приносить разные LP в зависимости от того, как сражалась остальная лобби. Бонусы за победу и за апсет тоже различаются.
