scorescreen.help.tooltip = Что это значит?
scorescreen.help.title = Как зарабатываются очки ладдера
scorescreen.help.combatScore = Взвешенная по стоимости ценность всех уничтоженных вами вражеских юнитов и зданий. Наивысший боевой счёт в игре задаёт эталон, по которому измеряются все остальные.
scorescreen.help.base = Основная часть ваших очков ладдера, масштабируемая по вашему боевому счёту относительно лучшего в игре. При победе или поражении каждый получает Базу — она вознаграждает ваш вклад в бой.
scorescreen.help.victory = Фиксированный бонус, добавляемый, когда ваша команда выигрывает игру.
scorescreen.help.valor = Утешительные очки для проигравшей стороны, масштабируемые по тому, насколько хорошо вы сражались, — признание тактической победы, несмотря на стратегическое поражение.
scorescreen.help.upset = Бонус за победу над более высоко ранжированным противником — чем больше преодолённый разрыв в рейтинге, тем больше награда.
scorescreen.help.lp = Очки ладдера — ваш сезонный рейтинговый счёт. В каждой игре вы получаете Базу плюс Победу или Доблесть (и любой бонус за Апсет); ваша сезонная сумма определяет ваше место в ладдере.
