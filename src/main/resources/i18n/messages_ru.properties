maptool.error=Невозможно запустить MapTool. TAF использует MapTool для обнаружения и проверки карт в ваших установках TA. Наиболее частая причина, по которой MapTool не запускается, связана с антивирусом. Убедитесь, что MapTool существует в указанном месте, и если нет, переустановите TAF и обратите внимание на то, что делает ваш антивирус. Другие причины сбоя MapTool включают (очень редко) поврежденную установку Windows.
