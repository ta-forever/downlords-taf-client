achievement.gw.rank.arm6.description = Ветеран-командир, чьи победы звучат среди звёзд.
achievement.gw.rank.arm7.title = Arm Полковник
achievement.gw.rank.arm7.description = Мастер кампаний, вы организуете освобождение целых систем.
achievement.gw.rank.arm8.title = Arm Генерал
achievement.gw.rank.arm8.description = Архитектор войны, ваши стратегии определяют продвижение Arm по галактике.
achievement.gw.rank.arm9.title = Arm Командир
achievement.gw.rank.arm9.description = Верховная власть на поле боя. Надежды Arm — и судьба миров — в ваших руках.

achievement.gw.rank.core1.title = Core Солдат
achievement.gw.rank.core1.description = Интегрирован в военную машину Core. Индивидуальность не имеет значения; важна только функция.
achievement.gw.rank.core2.title = Core Капрал
achievement.gw.rank.core2.description = Ваша эффективность растёт. Вы направляете младшие подразделения в точные, рассчитанные удары.
achievement.gw.rank.core3.title = Core Сержант
achievement.gw.rank.core3.description = Боевые данные оптимизированы. Вы выполняете операции с безжалостной точностью.
achievement.gw.rank.core4.title = Core Лейтенант
achievement.gw.rank.core4.description = Тактические полномочия предоставлены. Вы координируете атаки с машинной точностью.
achievement.gw.rank.core5.title = Core Капитан
achievement.gw.rank.core5.description = Расширены протоколы командования. Целые боевые группы реагируют на вашу вычисленную волю.
achievement.gw.rank.core6.title = Core Майор
achievement.gw.rank.core6.description = Стратегические подпрограммы разблокированы. Планетарные наступления разворачиваются по вашему плану.
achievement.gw.rank.core7.title = Core Полковник
achievement.gw.rank.core7.description = Достигнуто командование на уровне системы. Сопротивление анализируется, нейтрализуется и уничтожается.
achievement.gw.rank.core8.title = Core Генерал
achievement.gw.rank.core8.description = Вы — центр военной логики. Целые сектора падают перед вашим неизбежным наступлением.
achievement.gw.rank.core9.title = Core Командир
achievement.gw.rank.core9.description = Вершина иерархии Core. Ваши указания абсолютны — ассимиляция или уничтожение.

