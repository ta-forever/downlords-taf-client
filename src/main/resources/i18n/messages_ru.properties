# Setting: allow TAF to overwrite local changes to a mod
settings.fa.featuredModRevertOption = Перезаписать локальные изменения в моде?
# Description: revert local mod changes to official version
settings.fa.featuredModRevertOption.description = Перед тем как вы присоединитесь к игре или посмотрите повтор, TAF проверит правильность версии мода для вас. Если TAF обнаружит, что ваша установка была изменена (возможно, потому что вы разрабатываете новый мод), TAF не сможет продолжать, если вы не позволите TAF откатить эти изменения. Разрешить ли TAF вернуть ваш мод к официальной версии?

# Setting: force relay connection for game
settings.fa.forceRelay = Использовать ретранслятор для подключения
