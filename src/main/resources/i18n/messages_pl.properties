# Setting: allow TAF to overwrite local changes to a mod
settings.fa.featuredModRevertOption = Nadpisać lokalne zmiany w modzie?
# Description: revert local mod changes to official version
settings.fa.featuredModRevertOption.description = Przed dołączeniem do gry lub oglądaniem powtórki, TAF sprawdzi dla ciebie odpowiednią wersję moda. Jeśli TAF stwierdzi, że twoja instalacja została zmodyfikowana (może dlatego, że tworzysz nową modyfikację), TAF nie będzie mógł kontynuować, chyba że pozwolisz TAF na cofnięcie tych zmian. Czy TAF powinien mieć możliwość cofnięcia twojej modyfikacji z powrotem do wersji oficjalnej?

# Setting: force relay connection for game
settings.fa.forceRelay = Wymuś połączenie przez przekaźnik
# Description: use relay server for connection instead of direct peer-to-peer
settings.fa.forceRelay.description = Zawsze używaj serwera przekaźnikowego zamiast próbować bezpośrednio łączyć się z rówieśnikami. Powoduje to wolniejsze połączenia, ale może rozwiązać problemy z połączeniem.

# Setting: adjust latency threshold for relay selection
settings.fa.iceAcceptableLatency = Maksymalne akceptowalne opóźnienie przekaźnika
# Description: adjust the latency threshold for relay server selection
settings.fa.iceAcceptableLatency.description =  Dostosuj próg wyboru serwerów przekazujących na podstawie czasów pingów. Wyższe wartości mogą być korzystne dla graczy znajdujących się daleko od serwerów przekaźnikowych, zapewniając większy wybór i lepsze połączenia. Ustaw na -1, aby używać wszystkich przekaźników.

# Setting: maximum UDP packet size allowed
settings.fa.maxPacketSize = Maksymalny rozmiar pakietu
# Description: control the maximum size of UDP packets sent via ICE
settings.fa.maxPacketSize.description = Duże pakiety czasem mają problemy z przesyłaniem przez internet. Wybierz Mały, jeśli chcesz, aby TAF nałożył niższy limit wielkości pakietu. Może to pomóc w zwiększeniu szans na dotarcie pakietów do celu.

# Setting: resend multiple copies of each UDP packet if packet loss is detected
settings.fa.proactiveResend = Proaktywne ponowne wysłanie
# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = TAF może mierzyć utratę pakietów podczas konfiguracji gry. Jeśli straty są zbyt wysokie, TAF może rozpocząć wysyłanie wielu kopii każdego pakietu, aby zwiększyć szanse na ich dostarczenie. Ta opcja może pomóc w uruchomieniu gry lub może dalej blokować twoją sieć. Jeśli masz problemy z połączeniem z grami spróbuj włączyć tę opcję i sprawdź, czy pomoże.

