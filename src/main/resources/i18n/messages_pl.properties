# Setting: enable auto team balancing in-game using the +autoteam feature
settings.fa.enableAutoTeamBalance = Auto równowaga zespołu
# Description: enable automatic team balancing for a more competitive match
settings.fa.enableAutoTeamBalance.description = Wpuść graczy do pokoju bitwy we właściwej kolejności, aby uzyskać dobrze zrównoważone drużyny. (Działa tylko wtedy, gdy wszyscy w poczekalni dostaną się do pokoju bitewnego za pierwszym razem)

# Setting: relay chat messages between TAF client and in-game chat
