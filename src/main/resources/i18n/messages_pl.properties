scorescreen.help.combatScore = Ważona kosztem wartość wszystkich zniszczonych przez ciebie jednostek i budynków wroga. Najwyższy Wynik bojowy w grze wyznacza punkt odniesienia, względem którego mierzeni są wszyscy pozostali.
