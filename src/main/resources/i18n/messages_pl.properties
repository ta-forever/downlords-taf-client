achievement.gw.rank.arm1.title = Arm Żołnierz
achievement.gw.rank.arm1.description = Wstąp do szeregów Arm. Każda wojna zaczyna się od pojedynczego żołnierza.
achievement.gw.rank.arm2.title = Arm Kapral
achievement.gw.rank.arm2.description = Udowodnij swoje zaangażowanie w walce i zdobądź pierwszy dowództwo nad towarzyszami broni.
achievement.gw.rank.arm3.title = Arm Sierżant
achievement.gw.rank.arm3.description = Hartowany ogniem, dowodzisz z przodu i inspirujesz odwagę w szeregach.
achievement.gw.rank.arm4.title = Arm Porucznik
achievement.gw.rank.arm4.description = Zaufany zarówno w strategii, jak i w ochronie życia, niesiesz sztandar Arm w spornych światach.
achievement.gw.rank.arm5.title = Arm Kapitan
achievement.gw.rank.arm5.description = Doświadczony dowódca kompanii, twoje decyzje kształtują losy wojny planetarnej.
achievement.gw.rank.arm6.title = Arm Major
achievement.gw.rank.arm6.description = Weteran dowódca, którego zwycięstwa rozbrzmiewają wśród gwiazd.
achievement.gw.rank.arm7.title = Arm Pułkownik
achievement.gw.rank.arm7.description = Mistrz kampanii, organizujesz wyzwolenie całych systemów.
achievement.gw.rank.arm8.title = Arm Generał
achievement.gw.rank.arm8.description = Architekt wojny, twoje strategie definiują postępy Arm w całej galaktyce.
achievement.gw.rank.arm9.title = Arm Dowódca
achievement.gw.rank.arm9.description = Najwyższy autorytet na polu bitwy. Nadzieje Arm — i losy światów — spoczywają w twoich rękach.

achievement.gw.rank.core1.title = Core Żołnierz
achievement.gw.rank.core1.description = Zintegrowany z maszyną wojenną Core. Indywidualność jest nieistotna; liczy się funkcja.
achievement.gw.rank.core2.title = Core Kapral
achievement.gw.rank.core2.description = Twoja efektywność rośnie. Kierujesz mniejszymi jednostkami w precyzyjnych, obliczonych atakach.
achievement.gw.rank.core3.title = Core Sierżant
achievement.gw.rank.core3.description = Dane bojowe zostały udoskonalone. Wykonujesz operacje z bezwzględną optymalizacją.
achievement.gw.rank.core4.title = Core Porucznik
achievement.gw.rank.core4.description = Przyznano władzę taktyczną. Koordynujesz ataki z mechaniczną perfekcją.
achievement.gw.rank.core5.title = Core Kapitan
achievement.gw.rank.core5.description = Rozszerzono protokoły dowodzenia. Całe grupy bojowe reagują na twoją obliczoną wolę.
achievement.gw.rank.core6.title = Core Major
achievement.gw.rank.core6.description = Odblokowano podprogramy strategiczne. Ofensywy planetarne przebiegają zgodnie z twoim planem.
achievement.gw.rank.core7.title = Core Pułkownik
achievement.gw.rank.core7.description = Osiągnięto dowodzenie na poziomie systemu. Opór jest analizowany, zwalczany i eliminowany.
achievement.gw.rank.core8.title = Core Generał
achievement.gw.rank.core8.description = Jesteś centrum logiki wojennej. Całe sektory padają przed twoim nieuniknionym marszem.
achievement.gw.rank.core9.title = Core Dowódca
achievement.gw.rank.core9.description = Szczyt hierarchii Core. Twoje rozkazy są absolutne — asymilacja lub anihilacja.

