settings.general.reinstallLatest.description = Pobiera i ponownie instaluje najnowszą wersję z bieżącej konfiguracji, nawet jeśli odpowiada ona uruchomionej wersji. Weryfikuje podpis, a następnie uruchamia instalator (spowoduje to zamknięcie klienta).
