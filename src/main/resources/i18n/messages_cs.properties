scorescreen.help.valor = Útěchové body pro poraženou stranu, škálované podle toho, jak dobře jsi bojoval — uznání taktického vítězství navzdory strategické porážce.
scorescreen.help.upset = Bonus za vítězství nad výše postaveným soupeřem — čím větší rozdíl v žebříčku překonáš, tím větší odměna.
scorescreen.help.lp = Body žebříčku — tvé sezónní žebříčkové skóre. Každou hru si připíšeš Základ plus Vítězství nebo Statečnost (a případný bonus za Překvapení); tvůj sezónní součet určuje tvé postavení v žebříčku.
