scorescreen.help.combatScore = Hodnota všech nepřátelských jednotek a budov, které jsi zničil, vážená jejich cenou. Nejvyšší bojové skóre ve hře stanovuje měřítko, podle kterého se poměřují všichni ostatní.
scorescreen.help.base = Většina tvých bodů žebříčku, škálovaná podle tvého bojového skóre vůči nejlepšímu ve hře. Ať vyhraješ, nebo prohraješ, každý získá Základ — odměňuje, kolik jsi přispěl do boje.
