# Onboarding (one-time, dismissible)
lp.intro.title = Body žebříčku
lp.intro.body = Body žebříčku (LP) jsou tvé skóre pro sezónu. Získáváš je v každé hře za to, co děláš na bojišti – zničený materiál, vítězství a porážky silnějších týmů. Hraj celou sezónu, abys stoupal divizemi. Špatná hra prostě vynese méně – za prohru nikdy neztratíš LP.
# Combat Score -> LP explainer (§13.7)
lp.combatScore.explainer = Bojové skóre = hodnota (kov + energie / 60) nepřátelských jednotek, které jsi zničil. Tvé bojové LP jsou tvůj podíl na nejvyšším bojovém skóre hry – veď tabulku a získáš plnou částku, ať už vyhraješ, nebo prohraješ.
lp.faq.fewerThanLastGame = Bojové LP jsou tvůj podíl na nejvyšším bojovém skóre hry, takže stejné skóre může vynést různé LP podle toho, jak bojoval zbytek lobby. Bonusy za vítězství a překvapení se také liší.
