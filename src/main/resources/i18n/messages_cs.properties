settings.fa.enableAutoTeamBalance.description = Pusťte hráče do bitevní místnosti ve správném pořadí, abyste získali dobře vyvážené týmy. (Funguje pouze tehdy, pokud se všichni v předváděcí hale skutečně dostanou do bitevní místnosti na první pokus)

