# Description: revert local mod changes to official version
settings.fa.featuredModRevertOption.description = Než se připojíte k hře nebo budete sledovat záznam, TAF pro vás zkontroluje správnou verzi modu. Pokud TAF zjistí, že vaše instalace byla upravena (možná protože vytváříte nový mod), TAF nebude moci pokračovat, pokud nedovolíte TAFu vrátit tyto změny. Měl by mít TAF povoleno vrátit váš mod zpět na oficiální verzi?

# Setting: force relay connection for game
settings.fa.forceRelay = Přinutit spojení prostřednictvím relé
# Description: use relay server for connection instead of direct peer-to-peer
settings.fa.forceRelay.description = Vždy používejte relé server místo pokusu připojit se přímo k partnerům. To vede k pomalejšímu připojení, ale může vyřešit problémy s připojením.

# Setting: adjust latency threshold for relay selection
settings.fa.iceAcceptableLatency = Maximální přijatelná latence relé
# Description: adjust the latency threshold for relay server selection
settings.fa.iceAcceptableLatency.description =  Upravte práh pro výběr předávacích serverů na základě doby pingu. Vyšší hodnoty mohou být výhodné pro hráče umístěné daleko od přenosových serverů, což zajišťuje širší výběr pro lepší připojení. Chcete-li použít všechna relé, nastavte na -1.

# Setting: maximum UDP packet size allowed
settings.fa.maxPacketSize = Maximální velikost paketu
# Description: control the maximum size of UDP packets sent via ICE
settings.fa.maxPacketSize.description = Velké pakety někdy mají problémy s přenosem přes internet. Vyberte Tiny, pokud chcete, aby TAF nastavil nižší omezení na velikost paketu. To může pomoci zvýšit šance, že vaše pakety dorazí do cíle.

# Setting: resend multiple copies of each UDP packet if packet loss is detected
settings.fa.proactiveResend = Proaktivní opětovné odeslání
# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = TAF může měřit ztrátu paketů při nastavování hry. Pokud je ztráta paketů příliš vysoká, může TAF začít posílat několik kopií každého paketu, aby zlepšil šance na doručení. Tato možnost vám může pomoci spustit hru, nebo může dál zahlcovat vaši síť. Pokud máte problémy s připojením ke hrám, zkuste tuto možnost povolit a uvidíte, zda to pomůže.

