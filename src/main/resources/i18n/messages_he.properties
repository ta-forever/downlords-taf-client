achievement.gw.rank.arm1.title = Arm חייל
achievement.gw.rank.arm1.description = התגייסו לדפי ה-Arm. כל מלחמה מתחילה עם חייל אחד בלבד.
achievement.gw.rank.arm2.title = Arm קצין זוטר
achievement.gw.rank.arm2.description = הוכיחו את נחישותכם בקרב וקבלו את הפיקוד הראשון על הלוחמים הצעירים.
achievement.gw.rank.arm3.title = Arm סרג'נט
achievement.gw.rank.arm3.description = מחוזק באש, אתם מנהיגים מהחזית ומעניקים השראה לאומץ ברמות.
achievement.gw.rank.arm4.title = Arm לוטננט
achievement.gw.rank.arm4.description = מהימנים באסטרטגיה כמו בחיי אדם, אתם נושאים את הדגל של ה-Arm לעולמות שנויים במחלוקת.
achievement.gw.rank.arm5.title = Arm קפטן
achievement.gw.rank.arm5.description = מפקד מנוסה של חברות, החלטותיכם מעצבות את מהלך המלחמה הפלנטרית.
achievement.gw.rank.arm6.title = Arm מייג'ור
achievement.gw.rank.arm6.description = מפקד ותיק שניצחונותיו מהדהדים בין הכוכבים.
achievement.gw.rank.arm7.title = Arm קולונל
achievement.gw.rank.arm7.description = אמן מסעות קרב, אתם מארגנים את שחרור המערכות כולה.
achievement.gw.rank.arm8.title = Arm גנרל
achievement.gw.rank.arm8.description = אדריכל המלחמה, האסטרטגיות שלכם מגדירות את התקדמות ה-Arm ברחבי הגלקסיה.
achievement.gw.rank.arm9.title = Arm מפקד עליון
achievement.gw.rank.arm9.description = סמכות עליונה בשדה הקרב. התקוות של ה-Arm — וגורל העולמות — נתונות בידיכם.

achievement.gw.rank.core1.title = Core חייל
achievement.gw.rank.core1.description = משולב במכונת המלחמה של ה-Core. אינדיבידואליות אינה רלוונטית; פונקציה היא הכול.
achievement.gw.rank.core2.title = Core קצין זוטר
achievement.gw.rank.core2.description = היעילות שלכם עולה. אתם מכוונים יחידות קטנות במתקפות מדויקות ומחושבות.
achievement.gw.rank.core3.title = Core סרג'נט
achievement.gw.rank.core3.description = נתוני קרב מנותחים. אתם מבצעים מבצעים באופטימיזציה חסרת רחמים.
achievement.gw.rank.core4.title = Core לוטננט
achievement.gw.rank.core4.description = סמכות טקטית מוענקת. אתם מתאמים התקפות בשלמות מכנית.
achievement.gw.rank.core5.title = Core קפטן
achievement.gw.rank.core5.description = פרוטוקולי פיקוד מורחבים. פלוגות קרב שלמות פועלות לפי רצונכם המחושב.
achievement.gw.rank.core6.title = Core מייג'ור
achievement.gw.rank.core6.description = תת-שגרות אסטרטגיות פתוחות. מתקפות פלנטריות מתבצעות לפי תכנונכם.
achievement.gw.rank.core7.title = Core קולונל
achievement.gw.rank.core7.description = פיקוד ברמת המערכת מושג. ההתנגדות מנותחת, מנוטרלת ומוסרת.
achievement.gw.rank.core8.title = Core גנרל
achievement.gw.rank.core8.description = אתם מרכז לוגיקת מלחמה. מגזרים שלמים נופלים אל מול התקדמותכם הבלתי נמנעת.
achievement.gw.rank.core9.title = Core מפקד עליון
achievement.gw.rank.core9.description = פסגת היררכיית ה-Core. ההנחיה שלכם מוחלטת — הטמעה או השמדה.

