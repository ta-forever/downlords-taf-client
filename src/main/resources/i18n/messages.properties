# ===== Ladder Points (LADDER_POINTS_DESIGN.md) =====
# Core promise (§13.9) — never claim strict monotonicity; "never lose LP for losing".
lp.promise.core = You never lose Ladder Points for losing - a loss still banks your Combat Score and your hard-fought bonus.
lp.promise.division = Your division is yours for the season - it can only climb.
# Onboarding (one-time, dismissible)
lp.intro.title = Ladder Points
lp.intro.body = Ladder Points (LP) are your score for the season. You earn them every game for what you do on the field - materiel destroyed, victories, and beating tougher teams. Play through the season to climb divisions. A bad game just earns less - you never lose LP for losing.
# Combat Score -> LP explainer (§13.7)
lp.combatScore.explainer = Combat Score = the value (metal + energy / 60) of enemy units you destroyed. Your combat LP is your share of the game's top Combat Score - top the board and you bank the full amount, win or lose.
lp.faq.fewerThanLastGame = Combat LP is your share of the game's top Combat Score, so the same score can earn different LP depending on how the rest of the lobby fought. Win and upset bonuses vary too.
lp.combatScore.label = Combat Score
lp.combatScore.topInGame = top in game: {0}
# LP breakdown lines (§13.7)
lp.breakdown.combatBase = Combat base
lp.breakdown.combatBaseFormula = {0} (floor) + {1} x ({2} / {3})
lp.breakdown.winBonus = Win bonus
lp.breakdown.consolation = Hard-fought defeat
lp.breakdown.upsetBonus = Upset bonus
lp.breakdown.upsetDetail = beat a team {0} pts above you
lp.breakdown.total = LP this game
lp.breakdown.lowContribution = Low contribution -{0}
lp.perGame.change = +{0} LP
