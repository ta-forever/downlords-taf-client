# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = TAF can measure packet loss when setting up the game.  If packet loss is too high, TAF can start to send multiple copies of each packet to improve chances of delivery.  This option might help you to get a game going, or it might just clog up your network further.  If you have problems connecting to games try enabling this option and see if it helps.

