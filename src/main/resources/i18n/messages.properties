settings.fa.featuredModRevertOption.description = Before you join a game or watch a replay, TAF will checkout the correct version of the mod for you.  If TAF finds that your installation has been modified (perhaps because you're developing a new mod), TAF will not be able to proceed unless you allow TAF to revert those changes.  Should TAF be permitted to revert your mod back to an official version?

