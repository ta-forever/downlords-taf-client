scorescreen.col.valiance = Valor
scorescreen.col.valiance.tooltip = Combat reward earned for fighting well in defeat — a tactical victory in a strategic loss.
scorescreen.col.upset = Upset
scorescreen.col.lp = LP
scorescreen.dontShowAgain = Don't show again
scorescreen.help.tooltip = What do these mean?
scorescreen.help.title = How Ladder Points are earned
scorescreen.help.combatScore = The cost-weighted value of all enemy units and buildings you destroyed. The highest Combat Score in the game sets the benchmark everyone else is measured against.
scorescreen.help.base = The bulk of your Ladder Points, scaled by your Combat Score relative to the game's best. Win or lose, everyone earns Base — it rewards how much you contributed to the fight.
scorescreen.help.victory = A flat bonus added when your team wins the game.
scorescreen.help.valor = Consolation points for the losing side, scaled by how well you fought — recognition for a tactical victory despite the strategic loss.
scorescreen.help.upset = A bonus for winning against higher-ranked opposition — the bigger the ranking gap you overcome, the larger the reward.
scorescreen.help.lp = Ladder Points — your seasonal ranking score. Each game you bank Base plus Victory or Valor (and any Upset bonus); your season total sets your ladder rank.
