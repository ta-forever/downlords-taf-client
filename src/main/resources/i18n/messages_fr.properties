settings.fa.enableAutoJoin.description = Activez pour activer automatiquement la fonction Auto-Join pour tous les jeux auxquels vous jouez. Cela garantira que lorsque/si l'hôte réhéberge un autre jeu, vous le rejoindrez automatiquement pour une revanche

# Setting: auto-launch game directly to the battleroom as host
settings.fa.enableAutoLaunchOnHost = En tant qu'hôte, lancez Battleroom immédiatement
# Description: enable immediate launch to battleroom when hosting a new game
settings.fa.enableAutoLaunchOnHost.description = Activez si vous souhaitez lancer immédiatement Total Annihilation dans la salle de bataille lorsque vous hébergez une nouvelle partie. S'il est désactivé, vous devrez cliquer explicitement sur le bouton "Démarrer" après avoir hébergé une partie.

# Setting: auto-launch to battleroom when joining a game
settings.fa.enableAutoLaunchOnJoin = En tant que menuisier, lancement automatique vers Battleroom
# Description: launch directly into battleroom after joining a game
settings.fa.enableAutoLaunchOnJoin.description = Activez si vous souhaitez lancer Total Annihilation dans la salle de bataille dès que l'hôte fait de même. S'il est désactivé, vous devrez cliquer explicitement sur le bouton "Démarrer" après avoir rejoint une partie.

# Setting: automatically create new game after the host leaves
settings.fa.enableAutoRehost = Réhébergement auto
# Description: open a new game when the host leaves the current game
settings.fa.enableAutoRehost.description = Ouvrir automatiquement un nouveau jeu chaque fois qu'un jeu que vous avez précédemment hébergé se termine

# Setting: enable auto team balancing in-game using the +autoteam feature
settings.fa.enableAutoTeamBalance = Équilibrage auto de l'équipe
# Description: enable automatic team balancing for a more competitive match
settings.fa.enableAutoTeamBalance.description = Laissez les joueurs entrer dans la salle de bataille dans le bon ordre pour obtenir des équipes bien équilibrées. (Ne fonctionne que si tout le monde dans le hall de mise en scène arrive réellement dans la salle de bataille du premier coup)

# Setting: relay chat messages between TAF client and in-game chat
settings.fa.enableIrcIntegration = Relais de chat en jeu/TAF
# Description: forward in-game chat to TAF chat and vice versa
settings.fa.enableIrcIntegration.description = Lorsqu'il est activé, le chat en jeu est transféré au chat du client TAF et vice versa. Vous pouvez également fermer la connexion au chat dans le jeu en tapant "/closeirc"

# Setting: stagger player launches to reduce server load
settings.fa.enableSequencedLaunch = Lancement séquencé
# Description: stagger player launches into the battleroom
settings.fa.enableSequencedLaunch.description = Laissez les joueurs entrer dans la salle de combat les uns après les autres. Évite d'inonder l'hôte de demandes de connexion, ce qui peut entraîner un taux de réussite plus élevé.

# Setting: specify custom command line invocation for Total Annihilation
settings.fa.executableDecorator = Options de ligne de commande
# Description: add custom arguments to Total Annihilation execution
settings.fa.executableDecorator.description = Paramètres avec lesquels le client exécute le jeu. Laissez vide sauf si vous savez ce que vous faites.

# Setting: directory containing the Total Annihilation executable
settings.fa.executionDirectory = Répertoire d'exécution
# Description: specify the directory for Total Annihilation executable
settings.fa.executionDirectory.description = Répertoire dans lequel le client exécute le jeu. Laissez vide sauf si vous savez ce que vous faites.

# Setting: allow TAF to overwrite local changes to a mod
settings.fa.featuredModRevertOption = Remplacer les mod locales par le mod ?
# Description: revert local mod changes to official version
settings.fa.featuredModRevertOption.description = Avant de rejoindre un jeu ou de regarder une rediffusion, TAF vérifiera la bonne version du mod pour vous. Si TAF constate que votre installation a été modifiée (peut-être parce que vous développez un nouveau mod), TAF ne pourra pas continuer à moins que vous n'autorisiez TAF à annuler ces modifications. TAF devrait-il être autorisé à ramener votre mod à une version officielle ?

# Setting: force relay connection for game
settings.fa.forceRelay = Forcer la connexion relai
# Description: use relay server for connection instead of direct peer-to-peer
settings.fa.forceRelay.description = Toujours utiliser un serveur de relai plutôt qu'une connexion directe entre clients. La connexion sera plus lente mais cela peut résoudre des problèmes de connectivité.

# Setting: adjust latency threshold for relay selection
settings.fa.iceAcceptableLatency = Latence maximale acceptable du relais
# Description: adjust the latency threshold for relay server selection
settings.fa.iceAcceptableLatency.description =  Ajustez le seuil de sélection des serveurs relais en fonction des temps de ping. Des valeurs plus élevées peuvent être bénéfiques pour les joueurs situés loin des serveurs relais, garantissant une sélection plus large pour de meilleures connexions. Réglez sur -1 pour utiliser tous les relais.

# Setting: maximum UDP packet size allowed
settings.fa.maxPacketSize = Taille de paquet maximale
# Description: control the maximum size of UDP packets sent via ICE
settings.fa.maxPacketSize.description = Les gros paquets ont parfois du mal à traverser l'internet. Sélectionnez Petit si vous souhaitez que TAF fixe une limite inférieure à la taille des paquets. Cela peut aider à améliorer les chances que vos paquets arrivent à destination.

# Setting: resend multiple copies of each UDP packet if packet loss is detected
settings.fa.proactiveResend = Renvoi proactif
# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = TAF peut mesurer la perte de paquets lors de la configuration du jeu. Si la perte de paquets est trop élevée, TAF peut commencer à envoyer plusieurs copies de chaque paquet pour améliorer les chances de livraison. Cette option peut vous aider à lancer un jeu, ou elle peut simplement encombrer davantage votre réseau. Si vous avez des problèmes pour vous connecter à des jeux, essayez d'activer cette option et voyez si cela aide.

# Setting: run Total Annihilation as administrator
settings.fa.runas = Exécuter TA en tant qu'administrateur
# Description: try running TA with administrator privileges if it's not launching
settings.fa.runas.description = Essayez cela si rien ne semble se passer lorsque vous créez un jeu

