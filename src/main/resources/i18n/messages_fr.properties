# Description: decide whether to keep version tags on downloaded map packs
settings.data.mapDownloadKeepVersionTag.description = Cochez si vous souhaitez garder les balises de version sur les packs de cartes téléchargés (par ex., "my_map.v0002.ufo") ou décochez si vous souhaitez les supprimer (par ex., "my_map.ufo")

