# Description: integrate TAF client with TADA for replays
settings.general.tada.description = TADA est le guichet unique pour les rediffusions de Total Annihilation. Avec l'intégration TAF, vous pouvez parcourir, télécharger et regarder des rediffusions de TADA avec un minimum de tracas. Souhaitez-vous que TADA soit intégré au client TAF (avertissement \: utilise > 300 Mo de RAM) ; ou préférez-vous ouvrir TADA dans votre navigateur par défaut pour économiser de la mémoire ?

