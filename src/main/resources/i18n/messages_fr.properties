# Onboarding (one-time, dismissible)
lp.intro.title = Points de Ladder
lp.intro.body = Les Points de Ladder (LP) sont votre score pour la saison. Vous en gagnez à chaque partie pour ce que vous faites sur le terrain – matériel détruit, victoires et défaite d'équipes plus fortes. Jouez tout au long de la saison pour grimper les divisions. Une mauvaise partie rapporte simplement moins – vous ne perdez jamais de LP en perdant.
# Combat Score -> LP explainer (§13.7)
lp.combatScore.explainer = Score de combat = la valeur (métal + énergie / 60) des unités ennemies que vous avez détruites. Vos LP de combat sont votre part du meilleur Score de combat de la partie – dominez le tableau et vous empochez le montant total, victoire ou défaite.
lp.faq.fewerThanLastGame = Les LP de combat sont votre part du meilleur Score de combat de la partie, donc le même score peut rapporter des LP différents selon la façon dont le reste du salon a combattu. Les bonus de victoire et de surprise varient aussi.
