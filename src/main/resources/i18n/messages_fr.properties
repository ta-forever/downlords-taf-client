# Setting: duration of game data cache validity in days
settings.data.gameDataCache.time = Validité des données de jeu en cache en jours.
# Description: control how long game data is cached
settings.data.gameDataCache.time.description = Définit la durée pendant laquelle les fichiers de jeu sont gardés en cache. Régler sur une longue durée pour réduire les téléchargements. Régler sur une courte durée pour préserver l'espace disque.

