maptool.error=Неможливо запустити MapTool. TAF використовує MapTool для виявлення та перевірки карт у ваших установках TA. Найпоширеніша причина, через яку MapTool не запускається, - через антивірус. Перевірте, чи MapTool існує у вказаному місці, а якщо ні, переінсталюйте TAF та зверніть увагу на те, чим займається ваш антивірус. Інші причини несправності MapTool включають (дуже рідко) пошкоджену інсталяцію Windows.
