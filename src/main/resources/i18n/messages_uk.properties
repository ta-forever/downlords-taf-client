achievement.gw.rank.arm1.title = Arm Солдат
achievement.gw.rank.arm1.description = Станьте у ряди Arm. Кожна війна починається з одного солдата.
achievement.gw.rank.arm2.title = Arm Капрал
achievement.gw.rank.arm2.description = Доведіть свою рішучість у бою та отримайте перше командування над товаришами по зброї.
achievement.gw.rank.arm3.title = Arm Сержант
achievement.gw.rank.arm3.description = Загартований вогнем, ви ведете з передової та надихаєте мужність у рядах.
achievement.gw.rank.arm4.title = Arm Лейтенант
achievement.gw.rank.arm4.description = Надійний у стратегії та збереженні життів, ви несете прапор Arm у спірні світи.
achievement.gw.rank.arm5.title = Arm Капітан
achievement.gw.rank.arm5.description = Досвідчений командир роти, ваші рішення визначають хід планетарної війни.
achievement.gw.rank.arm6.title = Arm Майор
achievement.gw.rank.arm6.description = Ветеран-командир, чиї перемоги відлунюють серед зірок.
achievement.gw.rank.arm7.title = Arm Полковник
achievement.gw.rank.arm7.description = Майстер кампаній, ви організовуєте звільнення цілих систем.
achievement.gw.rank.arm8.title = Arm Генерал
achievement.gw.rank.arm8.description = Архітектор війни, ваші стратегії визначають просування Arm галактикою.
achievement.gw.rank.arm9.title = Arm Командувач
achievement.gw.rank.arm9.description = Верховна влада на полі бою. Надії Arm — і доля світів — у ваших руках.

achievement.gw.rank.core1.title = Core Солдат
achievement.gw.rank.core1.description = Інтегрований у воєнну машину Core. Індивідуальність не має значення; важлива лише функція.
achievement.gw.rank.core2.title = Core Капрал
achievement.gw.rank.core2.description = Ваша ефективність зростає. Ви керуєте меншими підрозділами у точних, розрахованих ударах.
achievement.gw.rank.core3.title = Core Сержант
achievement.gw.rank.core3.description = Бойові дані відточені. Ви виконуєте операції з безжальною оптимізацією.
achievement.gw.rank.core4.title = Core Лейтенант
achievement.gw.rank.core4.description = Надано тактичні повноваження. Ви координуєте атаки з механічною досконалістю.
achievement.gw.rank.core5.title = Core Капітан
achievement.gw.rank.core5.description = Розширено протоколи командування. Цілі бойові групи реагують на вашу обчислену волю.
achievement.gw.rank.core6.title = Core Майор
achievement.gw.rank.core6.description = Стратегічні підрутини розблоковано. Планетарні наступи відбуваються за вашим планом.
achievement.gw.rank.core7.title = Core Полковник
achievement.gw.rank.core7.description = Досягнуто командування на рівні системи. Опір аналізується, протидіє і ліквідується.
achievement.gw.rank.core8.title = Core Генерал
achievement.gw.rank.core8.description = Ви — центр воєнної логіки. Цілі сектори падають перед вашим неминучим просуванням.
achievement.gw.rank.core9.title = Core Командувач
achievement.gw.rank.core9.description = Вершина ієрархії Core. Ваші вказівки абсолютні — асиміляція або знищення.

