# Description: revert local mod changes to official version
settings.fa.featuredModRevertOption.description = Перш ніж ви приєднаєтеся до гри або подивитеся перегляд, TAF перевірить правильну версію моду для вас. Якщо TAF виявить, що ваша установка була змінена (можливо, через те, що ви розробляєте новий модуль), TAF не зможе продовжувати, якщо ви не дозволите TAF скасувати ці зміни. Чи дозволите ви TAF повернути ваш модуль назад до офіційної версії?

# Setting: force relay connection for game
