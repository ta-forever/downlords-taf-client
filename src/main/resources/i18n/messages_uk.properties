# Description: use relay server for connection instead of direct peer-to-peer
settings.fa.forceRelay.description = Завжди використовувати сервер-ретранслятор замість спроб підключення безпосередньо до учасників. Це може призвести до повільнішого з'єднання, але може вирішити проблеми з підключенням.

# Setting: adjust latency threshold for relay selection
settings.fa.iceAcceptableLatency = Максимальна допустима затримка реле
# Description: adjust the latency threshold for relay server selection
settings.fa.iceAcceptableLatency.description =  Налаштуйте порогове значення для вибору серверів ретрансляції на основі часу ping. Вищі значення можуть бути корисними для гравців, розташованих далеко від серверів ретрансляції, забезпечуючи ширший вибір для кращих з’єднань. Встановіть -1, щоб використовувати всі реле.

# Setting: maximum UDP packet size allowed
settings.fa.maxPacketSize = Максимальний розмір пакета
# Description: control the maximum size of UDP packets sent via ICE
settings.fa.maxPacketSize.description = Великі пакети іноді мають труднощі з пересуванням в Інтернеті. Виберіть Tiny, якщо ви хочете, щоб TAF встановив нижню межу розміру пакета. Це може допомогти поліпшити шанси, що ваші пакети дійдуть до пункту призначення.

# Setting: resend multiple copies of each UDP packet if packet loss is detected
settings.fa.proactiveResend = Проактивне повторне відправлення
# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = TAF може вимірювати втрати пакетів під час налаштування гри. Якщо рівень втрат пакетів занадто високий, TAF може почати надсилати кілька копій кожного пакета для підвищення ймовірності доставки. Ця опція може допомогти вам запустити гру, або може ще більше забити вашу мережу. Якщо у вас виникають проблеми з підключенням до ігор, спробуйте увімкнути цю опцію та подивіться, чи це допомагає.

