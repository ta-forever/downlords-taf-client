# Setting: auto-join subsequent games hosted by the current game host
settings.fa.enableAutoJoin = Unirse automáticamente a juegos reubicados
# Description: automatically join games rehosted by the current game host
settings.fa.enableAutoJoin.description = Habilite para activar automáticamente la función Auto-Unirse para cualquier juego que juegue. Esto asegurará que cuando/si el anfitrión vuelve a organizar otro juego, te unirás automáticamente para una revancha.

# Setting: auto-launch game directly to the battleroom as host
settings.fa.enableAutoLaunchOnHost = Como Anfitriona, Lanzar al Battleroom Inmediatamente
# Description: enable immediate launch to battleroom when hosting a new game
settings.fa.enableAutoLaunchOnHost.description = Activar si quieres lazar Total Annihilation inmediatamente al Battleroom cuando creas ua partida nueva, o en cuanto el anfrition lanze la partida. Si esta opcion esta desactivada, tendrias que darle al boton de "Start" despues de crear o juntarte a una partida.

# Setting: auto-launch to battleroom when joining a game
settings.fa.enableAutoLaunchOnJoin = Como Joiner, Auto-Lanzamiento a Battleroom
# Description: launch directly into battleroom after joining a game
settings.fa.enableAutoLaunchOnJoin.description = Habilítelo si desea lanzar Total Annihilation en la sala de batalla tan pronto como el anfitrión haga lo mismo. Si está deshabilitado, deberá hacer clic explícitamente en el botón "Iniciar" después de unirse a un juego.

# Setting: automatically create new game after the host leaves
settings.fa.enableAutoRehost = Realojamiento auto
# Description: open a new game when the host leaves the current game
settings.fa.enableAutoRehost.description = Abre automáticamente un nuevo juego cada vez que finaliza un juego que alojaste anteriormente

# Setting: enable auto team balancing in-game using the +autoteam feature
settings.fa.enableAutoTeamBalance = Equilibrio auto del equipo
# Description: enable automatic team balancing for a more competitive match
settings.fa.enableAutoTeamBalance.description = Deja que los jugadores entren en la sala de batalla en el orden correcto para formar equipos bien equilibrados. (Solo funciona si todos en el lobby de preparación realmente logran ingresar a la sala de batalla en el primer intento)

# Setting: relay chat messages between TAF client and in-game chat
settings.fa.enableIrcIntegration = Transmisión de chat en el juego/TAF
# Description: forward in-game chat to TAF chat and vice versa
settings.fa.enableIrcIntegration.description = Cuando activado, el chat dentro del juego es adelantado al client del TAF chat y viceversa.  Tambien puedes cerrar la connecion al chat dentro del juego tecleando  "/closeirc"

# Setting: stagger player launches to reduce server load
settings.fa.enableSequencedLaunch = Lanzamiento secuenciado
# Description: stagger player launches into the battleroom
settings.fa.enableSequencedLaunch.description = Deja que los jugadores entren a la sala de batalla uno tras otro. Evita inundar el host con solicitudes de conexión, por lo que puede generar una mayor tasa de éxito.

# Setting: specify custom command line invocation for Total Annihilation
settings.fa.executableDecorator = Formato de línea de comando para ejecutable.
# Description: add custom arguments to Total Annihilation execution
settings.fa.executableDecorator.description = Cómo el cliente ejecutará el ejecutable del juego. Déjelo en blanco a menos que sepa lo que está haciendo.

# Setting: directory containing the Total Annihilation executable
settings.fa.executionDirectory = Directorio de ejecución
# Description: specify the directory for Total Annihilation executable
settings.fa.executionDirectory.description = En qué directorio se debe ejecutar el ejecutable del juego. Déjelo en blanco a menos que sepa lo que está haciendo.

# Setting: allow TAF to overwrite local changes to a mod
settings.fa.featuredModRevertOption = ¿Sobrescribir los cambios locales en la mod?
# Description: revert local mod changes to official version
settings.fa.featuredModRevertOption.description = Antes de unirse a un juego o ver una repetición, TAF verificará la versión correcta del mod por usted. Si TAF encuentra que su instalación ha sido modificada (quizás porque está desarrollando una nueva modificación), TAF no podrá continuar a menos que permita que TAF revierta esos cambios. ¿Se debería permitir que TAF revierta su mod a una versión oficial?

# Setting: force relay connection for game
settings.fa.forceRelay = Forzar conexión de relé
# Description: use relay server for connection instead of direct peer-to-peer
settings.fa.forceRelay.description = Utilice siempre un servidor de retransmisión en lugar de intentar conectarse directamente a los compañeros. Esto da como resultado conexiones más lentas, pero puede resolver problemas de conectividad.

# Setting: adjust latency threshold for relay selection
settings.fa.iceAcceptableLatency = Latencia máxima aceptable del relé
# Description: adjust the latency threshold for relay server selection
settings.fa.iceAcceptableLatency.description =  Ajuste el umbral para seleccionar servidores de retransmisión según los tiempos de ping. Los valores más altos pueden resultar beneficiosos para los jugadores ubicados lejos de los servidores de retransmisión, ya que garantizan una selección más amplia para mejores conexiones. Establezca en -1 para usar todos los relés.

# Setting: maximum UDP packet size allowed
settings.fa.maxPacketSize = Tamaño máximo de paquete
# Description: control the maximum size of UDP packets sent via ICE
settings.fa.maxPacketSize.description = Los paquetes grandes a veces tienen problemas para atravesar Internet. Selecciona Pequeño si deseas que TAF coloque un límite inferior en el tamaño del paquete. Esto puede ayudar a mejorar las posibilidades de que tus paquetes lleguen a su destino.

# Setting: resend multiple copies of each UDP packet if packet loss is detected
settings.fa.proactiveResend = Reenvío Proactivo
# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = TAF puede medir la pérdida de paquetes al configurar el juego. Si la pérdida de paquetes es demasiado alta, TAF puede comenzar a enviar múltiples copias de cada paquete para mejorar las posibilidades de entrega. Esta opción podría ayudarte a iniciar un juego, o simplemente podría saturar aún más tu red. Si tienes problemas para conectarte a juegos, intenta habilitar esta opción y ve si ayuda.

# Setting: run Total Annihilation as administrator
settings.fa.runas = Ejecutar TA como administrador.
# Description: try running TA with administrator privileges if it's not launching
settings.fa.runas.description = Intenta esto si nada parece suceder cuando creas un juego

