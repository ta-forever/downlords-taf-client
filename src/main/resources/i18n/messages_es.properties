settings.data.gameDataCache.description = Caché de datos del juego guardando versiones no utilizadas. Disminuye significativamente la cantidad de archivos descargados, especialmente al ver repeticiones antiguas.

# Setting: duration of game data cache validity in days
settings.data.gameDataCache.time = Validez de la caché de datos del juego en días
# Description: control how long game data is cached
settings.data.gameDataCache.time.description = Define cuánto tiempo se almacenan en caché los archivos de datos del juego. Configure una gran cantidad de tiempo si desea evitar descargas. Establézcalo en una pequeña cantidad de tiempo para evitar un alto uso del disco.

