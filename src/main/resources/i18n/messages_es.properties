# Onboarding (one-time, dismissible)
lp.intro.title = Puntos de Ladder
lp.intro.body = Los Puntos de Ladder (LP) son tu puntuación de la temporada. Los ganas en cada partida por lo que haces en el campo: material destruido, victorias y vencer a equipos más fuertes. Juega toda la temporada para subir de división. Una mala partida simplemente rinde menos: nunca pierdes LP por perder.
# Combat Score -> LP explainer (§13.7)
lp.combatScore.explainer = Puntuación de combate = el valor (metal + energía / 60) de las unidades enemigas que destruiste. Tus LP de combate son tu parte de la mejor Puntuación de combate de la partida: encabeza la tabla y te llevas la cantidad completa, ganes o pierdas.
lp.faq.fewerThanLastGame = Los LP de combate son tu parte de la mejor Puntuación de combate de la partida, así que la misma puntuación puede rendir distintos LP según cómo haya luchado el resto de la sala. Los bonus de victoria y de sorpresa también varían.
