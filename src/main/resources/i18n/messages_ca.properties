achievement.gw.rank.arm1.title = Soldat Arm
achievement.gw.rank.arm1.description = Allista’t a les files de l’Arm. Tota guerra comença amb un sol soldat.
achievement.gw.rank.arm2.title = Caporal Arm
achievement.gw.rank.arm2.description = Demostra la teva determinació en combat i obtén el teu primer comandament sobre altres guerrers.
achievement.gw.rank.arm3.title = Sergent Arm
achievement.gw.rank.arm3.description = Trempat pel foc, lideres des del front i inspires coratge a les files.
achievement.gw.rank.arm4.title = Tinent Arm
achievement.gw.rank.arm4.description = Dipositari d’estratègia i de vides, portes l’estendard de l’Arm a mons en disputa.
achievement.gw.rank.arm5.title = Capità Arm
achievement.gw.rank.arm5.description = Líder veterà de companyies, les teves decisions modelen el curs de la guerra planetària.
achievement.gw.rank.arm6.title = Major Arm
achievement.gw.rank.arm6.description = Comandant experimentat, les teves victòries ressonen a través de les estrelles.
achievement.gw.rank.arm7.title = Coronel Arm
achievement.gw.rank.arm7.description = Mestre de campanyes, orquestres l’alliberament de sistemes sencers.
achievement.gw.rank.arm8.title = General Arm
achievement.gw.rank.arm8.description = Arquitecte de la guerra, les teves estratègies defineixen l’avanç de l’Arm per la galàxia.
achievement.gw.rank.arm9.title = Comandant Arm
achievement.gw.rank.arm9.description = Autoritat suprema al camp de batalla. Les esperances de l’Arm —i el destí de mons sencers— reposen a les teves mans.
achievement.gw.rank.core1.title = Soldat Core
achievement.gw.rank.core1.description = Integrat a la maquinària de guerra del Core. La individualitat és irrellevant; la funció ho és tot.
achievement.gw.rank.core2.title = Caporal Core
achievement.gw.rank.core2.description = La teva eficiència augmenta. Dirigeixes unitats inferiors amb atacs precisos i calculats.
achievement.gw.rank.core3.title = Sergent Core
achievement.gw.rank.core3.description = Dades de combat refinades. Executes operacions amb una optimització implacable.
achievement.gw.rank.core4.title = Tinent Core
achievement.gw.rank.core4.description = Autoritat tàctica concedida. Coordines assalts amb perfecció mecànica.
achievement.gw.rank.core5.title = Capità Core
achievement.gw.rank.core5.description = Protocols de comandament ampliats. Batallagrups sencers responen a la teva voluntat calculada.
achievement.gw.rank.core6.title = Major Core
achievement.gw.rank.core6.description = Subrutines estratègiques desbloquejades. Ofensives planetàries es despleguen segons el teu disseny.
achievement.gw.rank.core7.title = Coronel Core
achievement.gw.rank.core7.description = Comandament a nivell de sistema assolit. La resistència és analitzada, contrarestada i eliminada.
achievement.gw.rank.core8.title = General Core
achievement.gw.rank.core8.description = Ets un nexe de lògica bèl·lica. Sectors sencers cauen davant el teu avanç inevitable.
achievement.gw.rank.core9.title = Comandant Core
achievement.gw.rank.core9.description = Cim de la jerarquia del Core. La teva directiva és absoluta — assimilació o aniquilació.

