# Onboarding (one-time, dismissible)
lp.intro.title = Punts de Rànquing
lp.intro.body = Els Punts de Rànquing (LP) són la teva puntuació de la temporada. En guanyes cada partida pel que fas al camp: material destruït, victòries i derrotar equips més forts. Juga tota la temporada per pujar de divisió. Una mala partida simplement en dóna menys: mai no perds LP per perdre.
# Combat Score -> LP explainer (§13.7)
lp.combatScore.explainer = Puntuació de combat = el valor (metall + energia / 60) de les unitats enemigues que has destruït. Els teus LP de combat són la teva part de la millor Puntuació de combat de la partida: encapçala la taula i t'endús l''import complet, guanyis o perdis.
lp.faq.fewerThanLastGame = Els LP de combat són la teva part de la millor Puntuació de combat de la partida, així que la mateixa puntuació pot donar LP diferents segons com hagi lluitat la resta de la sala. Els bonus de victòria i de sorpresa també varien.
