scorescreen.help.combatScore = El valor ponderat pel cost de totes les unitats i edificis enemics que has destruït. La millor Puntuació de combat de la partida marca la referència amb què es mesuren tots els altres.
scorescreen.help.base = La major part dels teus Punts de Rànquing, escalada segons la teva Puntuació de combat respecte a la millor de la partida. Guanyis o perdis, tothom obté Base: recompensa quant has contribuït a la lluita.
scorescreen.help.victory = Un bonus fix afegit quan el teu equip guanya la partida.
scorescreen.help.valor = Punts de consolació per al bàndol perdedor, escalats segons com de bé has lluitat: reconeixement d'una victòria tàctica malgrat la derrota estratègica.
scorescreen.help.upset = Un bonus per guanyar contra rivals més ben classificats: com més gran sigui la diferència de classificació que superis, més gran serà la recompensa.
scorescreen.help.lp = Punts de Rànquing: la teva puntuació de classificació de la temporada. Cada partida acumules Base més Victòria o Valor (i qualsevol bonus de Sorpresa); el teu total de la temporada fixa la teva posició al rànquing.
