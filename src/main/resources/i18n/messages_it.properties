# Description: integrate TAF client with TADA for replays
settings.general.tada.description = TADA è l'unico sito per i replay di Total Annihilation. Con l'integrazione TAF, puoi sfogliare, scaricare e guardare replay da TADA con il minimo sforzo. Vuoi che TADA sia integrato nel client TAF (avviso\: utilizza più di 300MB di RAM) o preferisci aprire TADA nel tuo browser predefinito per risparmiare memoria?

