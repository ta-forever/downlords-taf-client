# Description: decide whether to keep version tags on downloaded map packs
settings.data.mapDownloadKeepVersionTag.description = Controlla se desideri lasciare i tag di versione sui pacchetti mappa scaricati (ad es., "my_map.v0002.ufo") o deselezionati se vuoi rimuoverli (ad es., "my_map.ufo")

