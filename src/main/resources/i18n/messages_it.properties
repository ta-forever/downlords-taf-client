# Description: cache unused game versions to reduce downloads
settings.data.gameDataCache.description = Cache dei dati di gioco salvando versioni non utilizzate. Riduce significativamente la quantità di file scaricati soprattutto quando si guardano vecchi replay.

# Setting: duration of game data cache validity in days
settings.data.gameDataCache.time = Validità della cache dei dati di gioco in giorni
# Description: control how long game data is cached
settings.data.gameDataCache.time.description = Definisce per quanto tempo i file di dati di gioco sono memorizzati nella cache. Imposta un tempo lungo per evitare download. Imposta un tempo breve per evitare un uso elevato del disco.

# Setting: retain version tags on downloaded map packs
