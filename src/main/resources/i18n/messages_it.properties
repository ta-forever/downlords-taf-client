achievement.gw.rank.arm1.title = Arm Soldato
achievement.gw.rank.arm1.description = Arruolati nelle fila dell’Arm. Ogni guerra inizia con un solo soldato.
achievement.gw.rank.arm2.title = Arm Caporale
achievement.gw.rank.arm2.description = Dimostra la tua determinazione in battaglia e ottieni il tuo primo comando sui compagni.
achievement.gw.rank.arm3.title = Arm Sergente
achievement.gw.rank.arm3.description = Temperato dal fuoco, guidi dalla prima linea e ispiri coraggio tra le truppe.
achievement.gw.rank.arm4.title = Arm Tenente
achievement.gw.rank.arm4.description = Fidato per strategia e vite, porti il vessillo dell’Arm in mondi contesi.
achievement.gw.rank.arm5.title = Arm Capitano
achievement.gw.rank.arm5.description = Leader esperto di compagnie, le tue decisioni plasmano l’andamento della guerra planetaria.
achievement.gw.rank.arm6.title = Arm Maggiore
achievement.gw.rank.arm6.description = Comandante veterano le cui vittorie riecheggiano tra le stelle.
achievement.gw.rank.arm7.title = Arm Colonnello
achievement.gw.rank.arm7.description = Maestro delle campagne, orchestrate la liberazione di interi sistemi.
achievement.gw.rank.arm8.title = Arm Generale
achievement.gw.rank.arm8.description = Architetto della guerra, le tue strategie definiscono l’avanzata dell’Arm attraverso la galassia.
achievement.gw.rank.arm9.title = Arm Comandante
achievement.gw.rank.arm9.description = Autorità suprema sul campo di battaglia. Le speranze dell’Arm — e il destino dei mondi — sono nelle tue mani.

achievement.gw.rank.core1.title = Core Soldato
achievement.gw.rank.core1.description = Integrato nella macchina da guerra del Core. L’individualità è irrilevante; la funzione è tutto.
achievement.gw.rank.core2.title = Core Caporale
achievement.gw.rank.core2.description = La tua efficienza aumenta. Dirigi unità minori in attacchi precisi e calcolati.
achievement.gw.rank.core3.title = Core Sergente
achievement.gw.rank.core3.description = Dati di combattimento affinati. Esegui operazioni con ottimizzazione spietata.
achievement.gw.rank.core4.title = Core Tenente
achievement.gw.rank.core4.description = Autorità tattica concessa. Coordini assalti con perfezione meccanica.
achievement.gw.rank.core5.title = Core Capitano
achievement.gw.rank.core5.description = Protocolli di comando ampliati. Interi gruppi di battaglia rispondono alla tua volontà calcolata.
achievement.gw.rank.core6.title = Core Maggiore
achievement.gw.rank.core6.description = Sottoprogrammi strategici sbloccati. Offensive planetarie si svolgono secondo il tuo piano.
achievement.gw.rank.core7.title = Core Colonnello
achievement.gw.rank.core7.description = Comando a livello di sistema raggiunto. La resistenza viene analizzata, contrastata e eliminata.
achievement.gw.rank.core8.title = Core Generale
achievement.gw.rank.core8.description = Sei un fulcro della logica bellica. Interi settori cadono davanti alla tua avanzata inevitabile.
achievement.gw.rank.core9.title = Core Comandante
achievement.gw.rank.core9.description = Apice della gerarchia del Core. Il tuo comando è assoluto: assimilazione o annientamento.

