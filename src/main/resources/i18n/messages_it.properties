# Description: automatically download missing maps
settings.fa.autoDownloadMaps.description = Se scaricare automaticamente le mappe mancanti.

# Button: select directory for game executable
settings.fa.chooseDirectory = Scegli...

# Setting: auto-join subsequent games hosted by the current game host
settings.fa.enableAutoJoin = Unisciti automaticamente ai Giochi Ri-Ospitati
# Description: automatically join games rehosted by the current game host
settings.fa.enableAutoJoin.description = Attiva per attivare automaticamente la funzionalità di Unione Automatica per i giochi che giochi. Questo assicurerà che quando/se l'host ri-ospita un altro gioco, ti unirai automaticamente a loro per una rivincita

# Setting: auto-launch game directly to the battleroom as host
settings.fa.enableAutoLaunchOnHost = Como Host, Avvia subito la battleroom
# Description: enable immediate launch to battleroom when hosting a new game
settings.fa.enableAutoLaunchOnHost.description = Attivalo se vuoi che Total Annihilation ti porti subito nella battleroom di TA quando una nuova partita viene creata. Quando è disattivato devi cliccare "Inizia" se vuoi che il gioco venga lanciato.

# Setting: auto-launch to battleroom when joining a game
settings.fa.enableAutoLaunchOnJoin = Come Partecipante, Avvio Automatico nella Sala Battaglie
# Description: launch directly into battleroom after joining a game
settings.fa.enableAutoLaunchOnJoin.description = Abilita se desideri lanciare Total Annihilation nella sala battaglie non appena l'host fa altrettanto. Se disabilitato, dovrai cliccare esplicitamente il pulsante "Inizia" dopo esserti unito a un gioco.

# Setting: automatically create new game after the host leaves
settings.fa.enableAutoRehost = Ri-hosting Automatico
# Description: open a new game when the host leaves the current game
settings.fa.enableAutoRehost.description = Apri automaticamente un nuovo gioco ogni volta che termina una partita che hai precedentemente ospitato

# Setting: enable auto team balancing in-game using the +autoteam feature
settings.fa.enableAutoTeamBalance = Bilanciamento auto della squadra
# Description: enable automatic team balancing for a more competitive match
settings.fa.enableAutoTeamBalance.description = Lascia che i giocatori entrino nella stanza di battaglia nel giusto ordine per ottenere squadre ben bilanciate. (Funziona solo se tutti nella lobby di staging riescono effettivamente ad entrare nella stanza di battaglia al primo tentativo)

# Setting: relay chat messages between TAF client and in-game chat
settings.fa.enableIrcIntegration = In gioco/TAF Chat Relay
# Description: forward in-game chat to TAF chat and vice versa
settings.fa.enableIrcIntegration.description = Quando attivo, la chat di gioco è trasferita al client TAF e viceversa. Si può disattivare durante una partita con il comando "/closeirc"

# Setting: stagger player launches to reduce server load
settings.fa.enableSequencedLaunch = Lancio sequenziato
# Description: stagger player launches into the battleroom
settings.fa.enableSequencedLaunch.description = Lascia che i giocatori entrino nella sala di battaglia uno dopo l'altro. Evita di inondare l'host con richieste di connessione, quindi potrebbe comportare una maggiore percentuale di successo.

# Setting: specify custom command line invocation for Total Annihilation
settings.fa.executableDecorator = Formato da linea di comando per l'eseguibile
# Description: add custom arguments to Total Annihilation execution
settings.fa.executableDecorator.description = Come il client lancia l'eseguibile del gioco. Lascia vuoto se non sai cosa stai facendo.

# Setting: directory containing the Total Annihilation executable
settings.fa.executionDirectory = Cartella di esecuzione
# Description: specify the directory for Total Annihilation executable
settings.fa.executionDirectory.description = In quale cartella l'eseguibile del gioco dovrebbe essere lanciato. Lascia vuoto se non sai cosa stai facendo.

# Setting: allow TAF to overwrite local changes to a mod
settings.fa.featuredModRevertOption = Sovrascrivere le modifiche locali al Mod?
# Description: revert local mod changes to official version
settings.fa.featuredModRevertOption.description = Prima di unirti a un gioco o guardare un replay, TAF verificherà la versione corretta del mod per te. Se TAF riscontra che la tua installazione è stata modificata (forse perché stai sviluppando un nuovo mod), TAF non potrà procedere a meno che tu non consenta a TAF di ripristinare quelle modifiche. TAF dovrebbe essere autorizzato a ripristinare il tuo mod alla versione ufficiale?

# Setting: force relay connection for game
settings.fa.forceRelay = Forza connessione relay
# Description: use relay server for connection instead of direct peer-to-peer
settings.fa.forceRelay.description = Usa sempre un server di inoltro invece di provare la connessione diretta ai peer. Questo risulta in connessioni più lente ma può risolvere problemi di connettività.

# Setting: adjust latency threshold for relay selection
settings.fa.iceAcceptableLatency = Latenza massima accettabile del relè
# Description: adjust the latency threshold for relay server selection
settings.fa.iceAcceptableLatency.description =  Regola la soglia per la selezione dei server di inoltro in base ai tempi di ping. Valori più alti possono essere vantaggiosi per i giocatori situati lontano dai server di inoltro, garantendo una selezione più ampia per connessioni migliori. Impostare su -1 per utilizzare tutti i relè.

# Setting: maximum UDP packet size allowed
settings.fa.maxPacketSize = Dimensione Massima del Pacchetto
# Description: control the maximum size of UDP packets sent via ICE
settings.fa.maxPacketSize.description = I pacchetti grandi a volte hanno problemi a attraversare internet. Seleziona Piccolo se desideri che TAF metta un limite inferiore alla dimensione del pacchetto. Questo potrebbe aiutare a migliorare le probabilità che i tuoi pacchetti arrivino a destinazione.

# Setting: resend multiple copies of each UDP packet if packet loss is detected
settings.fa.proactiveResend = Reinvio Proattivo
# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = TAF può misurare la perdita di pacchetti durante l'impostazione del gioco. Se la perdita di pacchetti è troppo alta, TAF può iniziare a inviare più copie di ciascun pacchetto per migliorare le possibilità di consegna. Questa opzione potrebbe aiutarti a far avviare un gioco, oppure potrebbe solo intasare ulteriormente la tua rete. Se hai problemi a connetterti ai giochi, prova ad attivare questa opzione e vedi se funziona.

# Setting: run Total Annihilation as administrator
settings.fa.runas = Esegui TA come amministratore.
# Description: try running TA with administrator privileges if it's not launching
settings.fa.runas.description = Prova questo se non sembra succedere nulla quando crei un gioco

