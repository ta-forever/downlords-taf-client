settings.fa.enableSequencedLaunch=Sequenzierter Start
settings.fa.enableSequencedLaunch.description=Lassen Sie die Spieler nacheinander in den Kampfraum. Verhindert, dass der Host mit Verbindungsanfragen überschwemmt wird, was zu einer höheren Erfolgsquote führen kann.
