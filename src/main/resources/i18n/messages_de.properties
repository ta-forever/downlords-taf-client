# Description: forward in-game chat to TAF chat and vice versa
settings.fa.enableIrcIntegration.description = Wenn angeschalten, wird Spiel-chat an den TAF client chat übertragen und umgekehrt. Sie können also die Chatverbindung im laufenden Spiel unterbrechen indem Sie "/closeirc" eingeben.

# Setting: stagger player launches to reduce server load
settings.fa.enableSequencedLaunch = Sequenzierter Start
# Description: stagger player launches into the battleroom
settings.fa.enableSequencedLaunch.description = Lassen Sie die Spieler nacheinander in den Kampfraum. Verhindert, dass der Host mit Verbindungsanfragen überschwemmt wird, was zu einer höheren Erfolgsquote führen kann.

# Setting: specify custom command line invocation for Total Annihilation
