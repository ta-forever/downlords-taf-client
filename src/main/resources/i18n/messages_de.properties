settings.fa.maxPacketSize=Maximale Paketgröße
settings.fa.maxPacketSize.description=Große Pakete haben manchmal Probleme, das Internet zu durchqueren. Wählen Sie Tiny aus, wenn Sie möchten, dass TAF eine niedrigere Obergrenze für die Paketgröße festlegt. Dies kann dazu beitragen, die Wahrscheinlichkeit zu verbessern, dass Ihre Pakete ihr Ziel erreichen.
settings.fa.proactiveResend=Proaktive Sendewiederholung
settings.fa.proactiveResend.description=TAF kann packet loss während der Spielerstellung erkennen. Falls der packet loss zu groß ist, kann TAF damit beginnen mehrere Kopien eines packets zu schicken, um die Wahrscheinlichkeit einer korrekten Übertragung zu erhöhen. Diese Option könnte helfen ein Spiel zu starten, ggf. könnte aber auch nur Ihre Internetverbindung unnötig mehr belasten. Falls Sie Schwierigkeiten haben die Verbindung zu Spielen aufzubauen, probieren Sie also diese Option.
