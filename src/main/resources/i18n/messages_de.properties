settings.fa.enableAutoJoin.description = Aktivieren Sie diese Option, um die Auto-Join-Funktion für alle Spiele, die Sie spielen, automatisch zu aktivieren. Dadurch wird sichergestellt, dass Sie, wenn/falls der Host ein anderes Spiel neu hostet, automatisch zu einem Rematch beitreten

# Setting: auto-launch game directly to the battleroom as host
settings.fa.enableAutoLaunchOnHost = Starten Sie als Host Battleroom sofort
# Description: enable immediate launch to battleroom when hosting a new game
settings.fa.enableAutoLaunchOnHost.description = Wählen Sie diese Option, falls Sie der host sind und beim Start von TA direkt in den Battleroom gelangen möchten; oder ggf. sobald ein host das Spiel startet. Inaktivierung der Option bedeutet, dass Sie explizit den "Start"-Knopf anklicken müssen, nachdem Sie ein Spiel als host gestartet haben, oder einem Spiel beigetreten sind.

# Setting: auto-launch to battleroom when joining a game
settings.fa.enableAutoLaunchOnJoin = Als Joiner automatisch zu Battleroom starten
# Description: launch directly into battleroom after joining a game
settings.fa.enableAutoLaunchOnJoin.description = Aktivieren Sie diese Option, wenn Sie Total Annihilation im Battleroom starten möchten, sobald der Host dies ebenfalls tut. Wenn deaktiviert, müssen Sie explizit auf die Schaltfläche „Start“ klicken, nachdem Sie einem Spiel beigetreten sind.

# Setting: automatically create new game after the host leaves
settings.fa.enableAutoRehost = Auto Rehosting
# Description: open a new game when the host leaves the current game
settings.fa.enableAutoRehost.description = Öffnen Sie automatisch ein neues Spiel, wenn ein zuvor von Ihnen gehostetes Spiel endet.

# Setting: enable auto team balancing in-game using the +autoteam feature
settings.fa.enableAutoTeamBalance = Auto Teambalance
# Description: enable automatic team balancing for a more competitive match
settings.fa.enableAutoTeamBalance.description = Lassen Sie die Spieler in der richtigen Reihenfolge in den Kampfraum, um gut ausbalancierte Teams zu bilden. (Funktioniert nur, wenn es alle in der Staging-Lobby beim ersten Versuch tatsächlich in den Kampfraum schaffen)

# Setting: relay chat messages between TAF client and in-game chat
