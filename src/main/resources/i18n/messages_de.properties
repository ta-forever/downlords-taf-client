# Description: specify the directory for Total Annihilation executable
settings.fa.executionDirectory.description = In welchem Ordner die Spiel-exe ausgeführt werden soll. Lass dieses Feld leer, außer du weißt was du tust.

# Setting: allow TAF to overwrite local changes to a mod
settings.fa.featuredModRevertOption = Lokale Änderungen an Mod überschreiben?
# Description: revert local mod changes to official version
settings.fa.featuredModRevertOption.description = Bevor Sie einem Spiel beitreten oder sich eine Wiederholung ansehen, überprüft TAF die richtige Version des Mods für Sie. Wenn TAF feststellt, dass Ihre Installation geändert wurde (vielleicht weil Sie einen neuen Mod entwickeln), kann TAF nicht fortfahren, es sei denn, Sie erlauben TAF, diese Änderungen rückgängig zu machen. Sollte es TAF erlaubt sein, Ihren Mod auf eine offizielle Version zurückzusetzen?

# Setting: force relay connection for game
settings.fa.forceRelay = Erzwinge "relay" Verbindung
# Description: use relay server for connection instead of direct peer-to-peer
settings.fa.forceRelay.description = Benutze immer einen relay-Server anstatt einer direkten Verbindung zu Peers. Das führt zu einer langsameren Verbindung, kann aber Verbindungsprobleme lösen.

# Setting: adjust latency threshold for relay selection
settings.fa.iceAcceptableLatency = Maximal akzeptable Latenz des Relays
# Description: adjust the latency threshold for relay server selection
settings.fa.iceAcceptableLatency.description =  Passen Sie den Schwellenwert für die Auswahl von Relay-Servern basierend auf Ping-Zeiten an. Höhere Werte können für Spieler, die weit von Relay-Servern entfernt sind, von Vorteil sein und eine größere Auswahl für bessere Verbindungen gewährleisten. Auf -1 einstellen, um alle Relais zu verwenden.

# Setting: maximum UDP packet size allowed
settings.fa.maxPacketSize = Maximale Paketgröße
# Description: control the maximum size of UDP packets sent via ICE
settings.fa.maxPacketSize.description = Große Pakete haben manchmal Probleme, sich im Internet zu bewegen. Wählen Sie Winzig, wenn TAF eine niedrigere Obergrenze für die Paketgröße setzen soll. Dies kann die Wahrscheinlichkeit erhöhen, dass Ihre Pakete am Ziel ankommen.

# Setting: resend multiple copies of each UDP packet if packet loss is detected
settings.fa.proactiveResend = Proaktive Sendewiederholung
# Description: send multiple copies of packets to mitigate packet loss
settings.fa.proactiveResend.description = TAF kann den Paketverlust beim Einrichten des Spiels messen. Wenn der Paketverlust zu hoch ist, kann TAF beginnen, mehrere Kopien jedes Pakets zu senden, um die Lieferchancen zu verbessern. Diese Option kann Ihnen helfen, ein Spiel in Gang zu setzen, oder sie kann Ihr Netzwerk weiter verstopfen. Wenn Sie Probleme beim Verbinden zu Spielen haben, aktivieren Sie diese Option und prüfen Sie, ob sie hilft.

