# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version Override'
        required: false
        type: string
        default: ""

jobs:
  release:
    environment: deploy
    runs-on: ubuntu-latest
    env:
      INSTALL4J_DIR: "install4j/install4j10.0.6"

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 20
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 20.0.2+9
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Version
        id: set_version
        run: |
          if [[ "${{ github.event.inputs.version_override }}" != "" ]]; then
            tag=${{ github.event.inputs.version_override }}
          else
            tag=$(date +%Y.%-m.%-d)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download Install4j
        run: |
          mkdir -p "$HOME/install4j"
          curl -fL https://download.ej-technologies.com/install4j/install4j_unix_10_0_6.tar.gz -o "$HOME/install4j/install4j.tar.gz"
          tar xzf "$HOME/install4j/install4j.tar.gz" -C "$HOME/install4j"

      - name: Build Windows Files
        run: |
          ./gradlew -Pversion="${{ steps.set_version.outputs.tag }}" \
          -PjavafxPlatform=win \
          -Pinstall4jHomeDir=$HOME/$INSTALL4J_DIR \
          -Pinstall4jLicense=${{ secrets.INSTALL4J_LICENSE }} \
          --info \
          --stacktrace \
          buildInstall4jMediaFiles

      - name: Build Linux Files
        run: |
          ./gradlew -Pversion="${{ steps.set_version.outputs.tag }}" \
          -PjavafxPlatform=linux \
          -Pinstall4jHomeDir=$HOME/$INSTALL4J_DIR \
          -Pinstall4jLicense=${{ secrets.INSTALL4J_LICENSE }} \
          --info \
          --stacktrace \
          buildInstall4jMediaFiles

      - name: Create Draft Release
        id: create_release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit: ${{ github.sha }}
          tag: v${{ steps.set_version.outputs.tag }}
          draft: true
          prerelease: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "build/install4j/tafclient_*,build/install4j/downlords-faf-client-*.txt,readme.linux.txt"

