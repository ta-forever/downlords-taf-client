compileTestJava {
  // The test suite has many pre-existing broken tests that reference
  // classes/methods removed in this fork. Only compile the packages
  // whose tests we have actively maintained and which are known to
  // compile cleanly.
  include '**/player/**'
  include '**/tournament/**'
  // Ladder Points (LADDER_POINTS_DESIGN.md) — new, self-contained package.
  include '**/ladder/**'
  // Self-contained, maintained tests for the crash-resilient game-log upload (marker + log tailing).
  // Scoped to the single files so they don't pull in broken siblings in those packages.
  include '**/game/GameLogUploadMarkerTest.java'
  include '**/game/ManualTeamArrangementControllerTest.java'
  // Self-contained "beat the model" scoreboard card (LIVE_PRICING_DESIGN.md §6) — FXML load + aggregation.
  include '**/wager/WagerBotPnlControllerTest.java'
  // Live wagering tab: FXML wiring, share-count buy preview, game-over/settlement indication,
  // and selection surviving navigation.
  include '**/wager/WagerControllerTest.java'
  // Self-contained team-card test (covers the friend/foe-icons-in-team-cards toggle).
  include '**/game/TeamCardControllerTest.java'
  include '**/game/ManageGameControllerTest.java'
  // Self-contained position-preselection start-order test (pure static helper).
  include '**/game/PositionRequestOrderTest.java'
  include '**/rating/JSkillsRatingServiceConstrainedTest.java'
  // Self-contained skill-rating tier hysteresis (LADDER_POINTS_DESIGN §13.2.3); no broken siblings pulled in.
  include '**/leaderboard/RatingTierServiceTest.java'
  // Pins the JS string escaping that replaced JSObject.call in the chat WebView (the fleet's
  // biggest JVM-crash source) and closes the backslash-escape hole in the old quoting.
  include '**/chat/ChatJsQuoteTest.java'
  include '**/util/LogTailUtilTest.java'
  // Replay mod-version resolution behind the vault card / detail labels. Scoped to the one file so
  // it doesn't pull in the broken ModServiceTest beside it.
  include '**/mod/ModServiceModVersionTest.java'
  // Pins the redaction that keeps the API access token (argv --hashtoken and the
  // /set_hash_api_token console push) out of the world-readable client.log.
  include '**/util/LogRedactUtilTest.java'
  // Self-contained Ed25519 update-signature verifier test (no broken siblings in update/).
  include '**/update/UpdateSignatureVerifierTest.java'
  // Watch-in-browser live viewer: watch menu, viewer URL composition, local asset server (Contract A).
  include '**/vault/replay/WatchButtonControllerTest.java'
  // Encrypted local demo recovery: decrypts a fixture produced by the Delphi recorder itself,
  // so the ChaCha20 port, the 326-byte preamble layout and the body-relative offset are all covered.
  include '**/replay/LocalDemoSealServiceTest.java'
  include '**/replay/BrowserWatchServiceTest.java'
  // Pins the replay download name against the server's TADA upload naming (tada_service.py);
  // pure formatter, no broken siblings pulled in.
  include '**/replay/CanonicalReplayNameTest.java'
  include '**/replay/ReplayArchiveWriterTest.java'
  include '**/replay/ReplayDownloadControlsTest.java'
  // Country flags: guards that every country we offer actually has a flag image
  // (Kosovo/XK is GeoIP-only, so Locale.getISOCountries() misses it).
  include '**/chat/CountryFlagServiceTest.java'
  include '**/chat/KittehGhostQuitTest.java'
  include '**/chat/KittehRejoinOnReconnectTest.java'
  // Replacements for the two Kitteh listeners this ircd defeats (bare-prefix NICK,
  // and the 433 fallback that renames us off a nick we already hold).
  include '**/chat/TafNickListenerTest.java'
  include '**/chat/TafNickRejectedListenerTest.java'
  include '**/chat/KittehNickRekeyTest.java'
  // Pins that a dropped connection keeps the channel tab (and its message history) open:
  // clearing the user list removes us too, which read as us leaving the channel.
  include '**/chat/ChatControllerTest.java'
  include '**/assetserver/**'
  // Test base classes / shared utilities — required by tests in the
  // included packages above. Don't include broken siblings of these.
  include '**/test/AbstractPlainJavaFxTest.java'
  exclude '**/PlayerBuilder.java'
  exclude '**/PlayerJoinedGameNotifierTest.java'
}

