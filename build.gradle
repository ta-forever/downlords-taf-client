task generateJarChecksums {
  def outputFile = file("$buildDir/install4j/downlords-faf-client-${version}-${javafxPlatform}.txt")
  def distLibsDir = file("$buildDir/install/${project.name}/")
  def nativesDir = file("$buildDir/resources/native/bin")

  inputs.dir distLibsDir
  inputs.dir nativesDir
  outputs.file outputFile

  doLast {
    if (!distLibsDir.exists()) {
      throw new GradleException("Jar output directory does not exist: $distLibsDir")
    }

    def digest = MessageDigest.getInstance("SHA-256")
    outputFile.text = ''

    def writeHash = { String category, File f ->
      f.withInputStream { stream ->
        digest.reset()
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) != -1) {
          digest.update(buffer, 0, read)
        }
        def hash = digest.digest().collect { String.format("%02x", it) }.join()
        outputFile << "${category} ${f.name} ${hash}\n"
      }
    }

    def processMatchingFiles = { String category, File dir, Pattern pattern ->
      if (dir.exists() && dir.isDirectory()) {
        dir.eachFileMatch(pattern) { File f ->
          if (f.isFile()) {
            writeHash(category, f)
          }
        }
      }
    }

    processMatchingFiles("lib", distLibsDir, ~/.*\.jar/)
    processMatchingFiles("natives", nativesDir, ~/.*\.exe/)
    processMatchingFiles("natives", nativesDir, ~/[^.]+$/) // files with no extension

    println "Wrote JAR checksums to: $outputFile"
  }
}

task buildInstall4jMediaFiles(type: Install4jTask) {
  group "distribution"
  description 'Creates install4j media files'
  dependsOn 'installDist'

  projectFile = file('downlords-taf-client.install4j')
  release = version

  switch (project.ext.javafxPlatform) {
    case "linux":
      //mediaTypes = ['unixInstaller', 'unixArchive']
      buildIds = [331]
      break
    case "mac":
      //mediaTypes = ['macos', 'macosFolder', 'macosArchive', 'macosFolderArchive']
      buildIds = []
      break
    case "win":
      //mediaTypes = ['windows']
      buildIds = [26]
      break
    case "win-x86":
      //mediaTypes = ['windows']
      buildIds = [886]
      break
  }

  doFirst {
    println "Building version ${version}"
    if (!project.hasProperty('install4jHomeDir')) {
      throw new RuntimeException('Specify install4jHomeDir in gradle.properties and set it to an install4j installation directory')
    }
  }
}

buildInstall4jMediaFiles.dependsOn generateJarChecksums
generateJarChecksums.mustRunAfter installDist

