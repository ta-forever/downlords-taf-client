}

def uidPlatform = ""
def gpgnetPlatforms = []
def tafPlatform = ""

if (javafxPlatform.contains("linux")) {
  uidPlatform = "linux64"
  gpgnetPlatforms = ["ubuntu-focal-x64", "win-x86"]
  tafPlatform = "ubuntu-focal-x64"
} else if (javafxPlatform.contains("win") && javafxPlatform.contains("x86")) {
  uidPlatform = "win32"
  gpgnetPlatforms = ["win-x86"]
  tafPlatform = "win-x86"
} else if (javafxPlatform.contains("win")) {
  uidPlatform = "win64"
  gpgnetPlatforms = ["win-x86"]
  tafPlatform = "win-x86"
} else {
  throw new GradleException("Unsupported platform: $javafxPlatform")
}

task downloadFafUid(type: Download) {
  group "native dependencies"
  src "https://github.com/ta-forever/uid/releases/download/${faf_uid_version}/faf-uid-${uidPlatform}.zip"
  dest file("${buildDir}/resources/faf-uid-${uidPlatform}.zip")
  onlyIfNewer true
}

task extractFafUid(type: Copy, dependsOn: [downloadFafUid]) {
  group "native dependencies"
  from zipTree("${buildDir}/resources/faf-uid-${uidPlatform}.zip")
  into file("${buildDir}/resources/native")
  doLast {
    if (uidPlatform.contains("linux")) {
      file("${buildDir}/resources/native/faf-uid").setExecutable(true, false)
    }
  }
}

gpgnetPlatforms.each { platform ->
  def ext = platform.contains("win") ? "zip" : "tar.gz"
  def downloadTaskName = "downloadGpgnet4Ta_${platform}"
  def extractTaskName = "extractGpgnet4Ta_${platform}"
  def archivePath = "${buildDir}/resources/gpgnet4ta-${platform}.${ext}"

  tasks.register(downloadTaskName, Download) {
    group = "native dependencies"
    // src "https://github.com/ta-forever/gpgnet4ta/releases/download/${gpgnet4ta_version}/gpgnet4ta-${platform}.${ext}"
    src "https://content.taforever.com/gpgnet4ta/${gpgnet4ta_version}/gpgnet4ta-${platform}.${ext}"
    dest file(archivePath)
    onlyIfNewer true
  }

  tasks.register(extractTaskName, Copy) {
    group = "native dependencies"
    dependsOn downloadTaskName
    def archiveFile = file(archivePath)
    from platform.contains("win") ? zipTree(archiveFile) : tarTree(resources.gzip(archiveFile))
    into file("${buildDir}/resources/native")
  }
}

task downloadTafToolbox(type: Download) {
  group "native dependencies"
  def ext = tafPlatform.contains("win") ? "zip" : "tar.gz"
  src "https://github.com/ta-forever/taftoolbox/releases/download/${taftoolbox_version}/taftoolbox-${tafPlatform}.${ext}"
  dest file("${buildDir}/resources/taftoolbox-${tafPlatform}.${ext}")
  onlyIfNewer true
}

task extractTafToolbox(type: Copy, dependsOn: [downloadTafToolbox]) {
  group "native dependencies"
  def archive = file("${buildDir}/resources/taftoolbox-${tafPlatform}.${tafPlatform.contains('win') ? 'zip' : 'tar.gz'}")
  from tafPlatform.contains('win') ? zipTree(archive) : tarTree(resources.gzip(archive))
  into file("${buildDir}/resources/native")
}

def gpgnetTasks = gpgnetPlatforms.collectMany { platform ->
  [
          tasks.named("downloadGpgnet4Ta_${platform}"),
          tasks.named("extractGpgnet4Ta_${platform}")
  ]
}

tasks.register("downloadNativeDependencies") {
  group = "native dependencies"
  dependsOn downloadFafUid, extractFafUid, downloadTafToolbox, extractTafToolbox, downloadIceAdapter
  dependsOn gpgnetTasks
}

compileJava.dependsOn 'downloadNativeDependencies'
compileJava.dependsOn ':webview-patch:build'
compileJava.dependsOn ':fxstage:build'

task sendCoverageToCodacy(type: JavaExec, dependsOn: jacocoTestReport) {
  main = "com.codacy.CodacyCoverageReporter"
  classpath = configurations.codacy
  args = ["-l", "Java", "-r", "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"]
}

repositories {
  mavenCentral()
  maven { url "https://jitpack.io" }
  maven { url 'https://maven.ej-technologies.com/repository' }
  // JitPack lost the build for FAForever/faf-java-commons commit c1db3577 (HTTP 404).
  // We host the rescued JARs ourselves; layout: <baseUrl>/<group>/<module>-<rev>.jar
  ivy {
    url 'https://sjc1.vultrobjects.com/deps/'
    patternLayout {
      artifact '[organization]/[module]-[revision].[ext]'
    }
    metadataSources { artifact() }
    content {
      includeGroup 'faf-java-commons'
    }
  }
}

